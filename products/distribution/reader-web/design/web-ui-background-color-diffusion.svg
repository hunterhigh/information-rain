<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1680 945" width="1680" height="945" role="img" aria-label="信息雨桌面网页封面态概念图：插画舞台居中，封面字段留在舞台内，背景由同一插画柔化延展">
  <defs>
    <filter id="ambientBlur" x="-15%" y="-15%" width="130%" height="130%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="22"/>
      <feColorMatrix type="saturate" values=".88"/>
    </filter>
    <linearGradient id="ambientVeil" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080d17" stop-opacity=".48"/>
      <stop offset=".5" stop-color="#111820" stop-opacity=".38"/>
      <stop offset="1" stop-color="#080d17" stop-opacity=".48"/>
    </linearGradient>
    <linearGradient id="coverShade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#090b10" stop-opacity="0"/>
      <stop offset=".52" stop-color="#090b10" stop-opacity="0"/>
      <stop offset=".72" stop-color="#090b10" stop-opacity=".45"/>
      <stop offset="1" stop-color="#090b10" stop-opacity=".94"/>
    </linearGradient>
    <clipPath id="stageClip"><rect x="637.5" y="112.5" width="405" height="720" rx="8"/></clipPath>
  </defs>

  <!-- Same cover art fills the page, deliberately blurred and toned down. -->
  <rect width="1680" height="945" fill="#0b111a"/>
  <image href="../content-pool/packs/lastferry/images/lastferry.jpg" x="-150" y="-1210" width="1980" height="3520" preserveAspectRatio="xMidYMid slice" filter="url(#ambientBlur)"/>
  <rect width="1680" height="945" fill="url(#ambientVeil)"/>

  <!-- Existing navigation destinations, with decorative icons reduced. -->
  <g font-family="Inter, 'Microsoft YaHei', sans-serif" text-anchor="middle">
    <text x="42" y="52" fill="#e8e3d9" font-family="'Noto Serif SC', 'Microsoft YaHei', serif" font-size="25" letter-spacing="3">雨</text>
    <text x="42" y="132" fill="#f1ede5" font-size="14">发现</text>
    <text x="42" y="188" fill="#a8a9aa" font-size="14">收藏</text>
    <text x="42" y="244" fill="#a8a9aa" font-size="14">搜索</text>
    <text x="42" y="300" fill="#a8a9aa" font-size="14">记录</text>
    <text x="42" y="891" fill="#a8a9aa" font-size="13">设置</text>
    <text x="42" y="919" fill="#e0ddd6" font-size="13">我</text>
  </g>
  <rect x="14" y="104" width="56" height="39" rx="3" fill="#f1ede5" opacity=".09"/>
  <rect x="14" y="104" width="2" height="39" fill="#d6b77b"/>

  <!-- Centered, crisp 9:16 stage. Cover fields remain inside, as in the supplied screenshot. -->
  <g clip-path="url(#stageClip)">
    <image href="../content-pool/packs/lastferry/images/lastferry.jpg" x="637.5" y="112.5" width="405" height="720" preserveAspectRatio="xMidYMid slice"/>
    <rect x="637.5" y="112.5" width="405" height="720" fill="url(#coverShade)"/>
  </g>
  <rect x="637.5" y="112.5" width="405" height="720" rx="8" fill="none" stroke="#eee9df" stroke-opacity=".16"/>

  <!-- Position indicator and save control from the current cover state. -->
  <rect x="656" y="132" width="137" height="36" rx="18" fill="#11151d" fill-opacity=".70"/>
  <text x="674" y="155" fill="#f3f1ec" font-family="Inter, 'Microsoft YaHei', sans-serif" font-size="12" font-weight="600">21 / 23</text>
  <rect x="730" y="149" width="47" height="2" rx="1" fill="#e8e5df" fill-opacity=".35"/>
  <rect x="730" y="149" width="47" height="2" rx="1" fill="#c5cbe1" fill-opacity=".95"/>
  <circle cx="1007" cy="150" r="28" fill="#11151d" fill-opacity=".64" stroke="#eee9df" stroke-opacity=".14"/>
  <text x="1007" y="159" text-anchor="middle" fill="#f5f2eb" font-family="Arial, sans-serif" font-size="27">♡</text>

  <!-- Exact cover data from lastferry: tags, title, author, synopsis, duration, enter. -->
  <g font-family="Inter, 'Microsoft YaHei', sans-serif">
    <g fill="#11151d" fill-opacity=".34" stroke="#ffffff" stroke-opacity=".24">
      <rect x="665" y="566" width="51" height="27" rx="14"/><rect x="724" y="566" width="51" height="27" rx="14"/><rect x="783" y="566" width="51" height="27" rx="14"/>
    </g>
    <g fill="#fffefa" font-family="'Noto Serif SC', 'Microsoft YaHei', serif" font-size="11" text-anchor="middle">
      <text x="690.5" y="584">暴雨</text><text x="749.5" y="584">亲情</text><text x="808.5" y="584">救援</text>
    </g>
    <text x="665" y="638" fill="#fffefa" font-family="'Noto Serif SC', 'Microsoft YaHei', serif" font-size="29" font-weight="700">最后一班渡船</text>
    <text x="665" y="669" fill="#eeeae2" font-size="13">林间来信</text>
    <text x="665" y="709" fill="#f1eee8" font-size="12.5">
      <tspan x="665" dy="0">暴雨封住两岸，小满想在弟弟出生前</tspan>
      <tspan x="665" dy="22">赶到北岸诊所见母亲。渡船只剩一趟油，</tspan>
      <tspan x="665" dy="22">你得决定先把谁送到哪里。</tspan>
    </text>
    <text x="665" y="783" fill="#d5d2cb" font-size="12">8 分钟</text>
  </g>
  <rect x="665" y="784" width="94" height="42" rx="21" fill="#f1eee8" fill-opacity=".20" stroke="#ffffff" stroke-opacity=".35"/>
  <text x="712" y="810" text-anchor="middle" fill="#fffefa" font-family="'Noto Serif SC', 'Microsoft YaHei', serif" font-size="16">进入</text>

  <!-- Existing right-rail fields; unchanged from the actual demo's cover state. -->
  <g font-family="Inter, 'Microsoft YaHei', sans-serif">
    <text x="1196" y="180" fill="#aaa9a5" font-size="12" letter-spacing="1">创作者</text>
    <text x="1196" y="211" fill="#eeeae2" font-size="15">林间来信</text>
    <text x="1196" y="270" fill="#e7e2d8" font-size="13">♡　收藏</text>
    <text x="1340" y="270" fill="#8f9295" font-size="13">评论未开放</text>

    <text x="1196" y="345" fill="#aaa9a5" font-size="12" letter-spacing="1">体验图</text>
    <text x="1196" y="369" fill="#d0cec8" font-size="12">未开始</text>
    <text x="1196" y="406" fill="#b4b3ae" font-size="12">尚无足迹</text>
    <text x="1196" y="435" fill="#777a7d" font-size="12">— 等待探索 —</text>

    <text x="1196" y="527" fill="#aaa9a5" font-size="12">节点数</text>
    <text x="1517" y="527" fill="#dedbd4" font-size="12" text-anchor="end">11</text>
    <text x="1196" y="560" fill="#aaa9a5" font-size="12">体验时长</text>
    <text x="1517" y="560" fill="#dedbd4" font-size="12" text-anchor="end">8 分钟</text>
    <text x="1196" y="593" fill="#aaa9a5" font-size="12">结局数</text>
    <text x="1517" y="593" fill="#dedbd4" font-size="12" text-anchor="end">4</text>
    <text x="1196" y="626" fill="#aaa9a5" font-size="12">标签</text>
    <text x="1517" y="626" fill="#dedbd4" font-size="12" text-anchor="end">暴雨 / 亲情 / 救援</text>

    <text x="1196" y="690" fill="#aaa9a5" font-size="12" letter-spacing="1">作品简介</text>
    <text x="1196" y="717" fill="#c7c5bf" font-size="12">
      <tspan x="1196" dy="0">暴雨封住两岸，小满想在弟弟出生前</tspan>
      <tspan x="1196" dy="22">赶到北岸诊所见母亲。渡船只剩一趟油，</tspan>
      <tspan x="1196" dy="22">你得决定先把谁送到哪里。</tspan>
    </text>
  </g>
</svg>
