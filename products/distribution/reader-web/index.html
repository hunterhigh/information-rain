                    </div>
                </button>
            `).join('');
        }

        function jumpToWorld(worldId) {
            const index = worlds.findIndex(w => w.id === worldId);
            if (index !== -1) {
                switchPage('worlds');
                goToWorld(index, 0);
            }
        }

        function renderSearchResults(rawQuery) {
            const query = rawQuery.trim().toLocaleLowerCase();
            el.searchResults.replaceChildren();
            if (!query) {
                const hint = document.createElement('p');
                hint.className = 'text-sm text-white/30 text-center py-10';
                hint.textContent = '输入关键词开始搜索';
                el.searchResults.appendChild(hint);
                return;
            }

            const matches = worlds.filter(world =>
                [world.title, world.author, world.desc, ...world.tags].some(value => value.toLocaleLowerCase().includes(query))
            );
            if (!matches.length) {
                const empty = document.createElement('p');
                empty.className = 'text-sm text-white/40 text-center py-10';
                empty.textContent = '没有找到匹配的内容';
                el.searchResults.appendChild(empty);
                return;
            }

            for (const world of matches) {
                const result = document.createElement('button');
                result.type = 'button';
                result.className = 'w-full flex items-center gap-3 text-left p-3 rounded-xl bg-white/5 border border-white/10 hover:bg-white/10';
                const image = document.createElement('span');
                image.className = 'w-14 h-16 shrink-0 rounded-lg bg-cover bg-center';
                image.style.backgroundImage = `url(${world.thumbnail || world.image})`;
                const details = document.createElement('span');
                const title = document.createElement('strong');
                title.className = 'block text-sm text-white/90';
                title.textContent = world.title;
                const subtitle = document.createElement('small');
                subtitle.className = 'block text-xs text-white/45 mt-1';
                subtitle.textContent = `${world.author} · ${world.tags.join(' / ')}`;
                details.append(title, subtitle);
                result.append(image, details);
                result.addEventListener('click', () => jumpToWorld(world.id));
                el.searchResults.appendChild(result);
            }
        }

        // ============================================================
        // 账号页面
        // ============================================================
        function updateProfileStats() {
            const bookmarks = getBookmarks();
            const endings = getCollectedEndings();
            const footprints = getFootprints();
            const activeIds = new Set(worlds.map(world => world.id));
            const visibleFootprints = footprints.filter(fp => activeIds.has(fp.worldId));

            el.statWorlds.textContent = stats.exploredWorlds.filter(id => activeIds.has(id)).length;
            el.statEndings.textContent = endings.filter(key => activeIds.has(key.split('::')[0])).length;
            el.statBookmarks.textContent = bookmarks.filter(id => activeIds.has(id)).length;

            // Render footprints
            if (visibleFootprints.length === 0) {
                el.footprintList.innerHTML = '<p class="text-xs text-white/25 text-center py-4">还没有探索记录</p>';
            } else {
                el.footprintList.innerHTML = visibleFootprints.slice(0, 10).map(fp => {
                    const world = worlds.find(w => w.id === fp.worldId);
                    const worldName = world ? world.title : '未知内容';
                    const time = new Date(fp.time).toLocaleDateString('zh-CN');
                    return `
                        <div class="flex items-center justify-between p-2 rounded-lg bg-white/[0.03] border border-white/[0.06]">
                            <div>
                                <div class="text-xs text-white/70">${worldName}</div>
                                <div class="text-[10px] text-white/30 mt-0.5">结局：${fp.endingTitle || '未记录'}</div>
                            </div>
                            <span class="text-[10px] text-white/25">${time}</span>
                        </div>
                    `;
                }).join('');
            }
        }

        function toggleTextSize() {
            const sizes = ['sm', 'md', 'lg'];
            const labels = { sm: '小', md: '中', lg: '大' };
            const currentIdx = sizes.indexOf(settings.textSize || 'md');
            const nextIdx = (currentIdx + 1) % sizes.length;
            settings.textSize = sizes[nextIdx];
            applySettings();
            saveSettings();
            showToast('文字大小：' + labels[settings.textSize]);
        }

        function clearAllData() {
            if (!confirm('确定要清除所有本地数据吗？此操作不可恢复。')) return;

            Object.values(LS_KEYS).forEach(key => localStorage.removeItem(key));
            stats = { exploredWorlds: [], collectedEndings: [], totalSteps: 0 };
            settings = { textSize: 'md' };
            applySettings();
            updateProfileStats();
            renderBookmarks();
            updateLikeButton();
            showToast('所有数据已清除');
        }

        // ============================================================
        // 世界加载
        // ============================================================
        function loadWorld(index, direction = 'next') {
            const world = worlds[index];
            if (!world.data && world.storyUrl) {
                const preload = () => loadStory(world).catch(() => undefined);
                if ('requestIdleCallback' in window) requestIdleCallback(preload, { timeout: 1200 });
                else setTimeout(preload, 250);
            }
            const swipeTransition = pendingWorldGesture;
            prepareWorldImageWindow(index);
            el.stage.classList.remove('is-reading');
            clearSwipeFeedback(!swipeTransition);
            el.stage.classList.toggle('is-screen-swap-pending', Boolean(swipeTransition));
            sendExperience('SHOW_COVER');

            if (worldSwiper) {
                worldSwiper.allowTouchMove = true;
                worldSwiper.mousewheel?.enable();
            }

            if (nodeTransitionTimer) clearTimeout(nodeTransitionTimer);
            nodeTransitionTimer = null;
            clearNodeTextSettle();
            clearNodeTextExitCopies();
            el.nodeText.textContent = '';
            el.nodeText.classList.remove('typing');
            el.nodeLayer.classList.remove('fade-in');
            el.nodeLayer.style.opacity = '';
            el.nodeLayer.style.transform = '';
            el.nodeLayer.style.transition = '';

            // 更新氛围背景
            el.ambience.style.backgroundImage = world.image ? `url(${world.image})` : '';
            el.ambience.style.backgroundColor = '#111118';
            if (!pendingWorldGesture) updateWorldBackdrop(world);

            // 封面信息
            el.coverTitle.textContent = world.title;
            el.coverAuthor.textContent = world.author;
            el.coverDesc.textContent = world.desc;
            el.coverDuration.textContent = world.duration;

            // 标签
            el.worldTags.innerHTML = world.tags.map(t =>
                `<span class="px-2 py-0.5 rounded-full text-[10px] bg-white/10 text-white/70 border border-white/10">${t}</span>`
            ).join('');

            // 右侧信息
            el.rightAuthor.textContent = world.author;
            el.rightDesc.textContent = world.desc;
            el.metaNodes.textContent = world.nodes;
            el.metaTime.textContent = world.duration;
            el.metaEnds.textContent = world.ends;
            el.metaTags.textContent = world.tags.join(' / ');

            // 头像色
            const gradients = [
                'from-pink-500 to-orange-400',
                'from-emerald-400 to-cyan-500',
                'from-violet-500 to-purple-500',
                'from-amber-400 to-red-400',
                'from-blue-400 to-indigo-500',
                'from-teal-400 to-green-500',
                'from-rose-400 to-pink-600',
                'from-cyan-400 to-blue-500',
                'from-orange-400 to-yellow-500',
                'from-indigo-400 to-violet-500',
                'from-fuchsia-400 to-rose-500',
                'from-lime-400 to-emerald-500'
            ];
            el.authorAvatar.className = `info-avatar w-12 h-12 rounded-full bg-gradient-to-br ${gradients[index % gradients.length]} shrink-0`;

            // 更新喜欢按钮状态
            updateLikeButton();

            // 重置状态
            currentNodeId = null;
            pathHistory = [];

            // 显示封面，隐藏节点层和结局层
            el.coverLayer.classList.remove('hidden');
            el.btnEnter.classList.remove('hidden');
            el.nodeLayer.classList.add('opacity-0', 'pointer-events-none');
            el.endingLayer.classList.add('hidden');
            el.btnExit.classList.add('opacity-0', 'pointer-events-none');
            el.btnExit.inert = true;
            el.btnSave.classList.remove('hidden');
            el.dirControls.classList.add('opacity-0', 'pointer-events-none');
            el.dirControls.inert = true;
            document.getElementById('mobileBranchHints').hidden = true;

            // 更新体验图
            renderExpMap();

            // 更新指示器
            updateWorldDots();

            // 重新生成粒子
            if (!pendingWorldGesture) generateParticles(world.theme.particles);

            if (swipeTransition) {
                pendingWorldGesture = null;
                el.stage.classList.remove('is-screen-swap-pending');
                animateScreenSnapshot(swipeTransition.snapshot, swipeTransition.direction, () => {
                    updateWorldBackdrop(world);
                    generateParticles(world.theme.particles);
                });
            }
        }

        let activeWorldBackdrop = null;

        function updateWorldBackdrop(world) {
            const next = activeWorldBackdrop === el.worldBackdropA ? el.worldBackdropB : el.worldBackdropA;
            next.style.backgroundImage = world.image ? `url("${world.image}")` : 'none';
            next.style.backgroundColor = world.theme?.bg || '#111118';
            next.classList.add('is-visible');
            activeWorldBackdrop?.classList.remove('is-visible');
            activeWorldBackdrop = next;
        }

        function updateLikeButton() {
            const world = worlds[currentWorldIndex];
            const isLiked = isBookmarked(world.id);
            for (const likeBtn of [el.btnLike, el.btnSave]) {
                if (!likeBtn) continue;
                const heart = likeBtn.querySelector('span:first-child');
                heart.textContent = isLiked ? '♥' : '♡';
                heart.style.color = isLiked ? '#ef4444' : '';
                likeBtn.setAttribute('aria-pressed', String(isLiked));
                likeBtn.setAttribute('aria-label', isLiked ? '取消收藏当前内容' : '收藏当前内容');
            }
        }

        function generateParticles(color) {
            const layer = document.getElementById('particlesLayer');
            if (!layer) return;
            layer.innerHTML = '';
            const particleColor = {
                rain: 'rgba(190, 215, 255, 0.22)',
                dust: 'rgba(255, 245, 220, 0.18)'
            }[color] || color;
            for (let i = 0; i < 20; i++) {
                const p = document.createElement('div');
                p.className = 'particle';
                const size = Math.random() * 4 + 2;
                p.style.width = size + 'px';
                p.style.height = size + 'px';
                p.style.background = particleColor;
                p.style.left = Math.random() * 100 + '%';
                p.style.top = Math.random() * 100 + '%';
                p.style.animationDelay = Math.random() * 15 + 's';
                p.style.animationDuration = (10 + Math.random() * 10) + 's';
                layer.appendChild(p);
            }
        }

        // ============================================================
        // 进入世界
        // ============================================================
        async function loadStory(world) {
            if (world.data) return world.data;
            if (!world.storyUrl) throw new Error('故事内容不可用');
            if (!storyRequests.has(world.id)) {
                const request = fetch(world.storyUrl)
                    .then(response => {
                        if (!response.ok) throw new Error(`故事加载失败：${response.status}`);
                        return response.json();
                    })
                    .then(data => {
                        if (!data || typeof data !== 'object' || !data[world.startNode]) throw new Error('故事数据无效');
                        world.data = data;
                        return data;
                    })
                    .catch(error => { storyRequests.delete(world.id); throw error; });
                storyRequests.set(world.id, request);
            }
            return storyRequests.get(world.id);
        }

        async function enterWorld() {
            const requestedIndex = currentWorldIndex;
            const world = worlds[requestedIndex];
            el.btnEnter.disabled = true;
            try {
                await loadStory(world);
            } catch (error) {
                showToast('故事暂时无法加载，请重试');
                el.btnEnter.disabled = false;
                return;
            }
            if (currentWorldIndex !== requestedIndex || currentPage !== 'worlds') {
                el.btnEnter.disabled = false;
                return;
            }
            el.btnEnter.disabled = false;
            sendExperience(experienceMatches('worlds.reading.ending') ? 'RESTART' : 'ENTER');
            if (worldSwiper) {
                worldSwiper.allowTouchMove = false;
                worldSwiper.mousewheel?.disable();
            }
            currentNodeId = world.startNode;
            el.stage.classList.add('is-reading');
            pathHistory = [currentNodeId];

            // 记录探索
            if (!stats.exploredWorlds.includes(world.id)) {
                stats.exploredWorlds.push(world.id);
                saveStats();
            }

            // 动画切换
            el.coverLayer.classList.add('hidden');
            el.btnEnter.classList.add('hidden');
            el.nodeLayer.classList.remove('opacity-0', 'pointer-events-none');
            el.btnExit.classList.remove('opacity-0', 'pointer-events-none');
            el.btnExit.inert = false;
            el.btnSave.classList.add('hidden');

            renderNode(currentNodeId, 'fade');
            renderExpMap();
        }

        // ============================================================
        // 渲染节点
        // ============================================================
        function clearNodeTextSettle() {
            if (nodeTextSettleTimer) clearTimeout(nodeTextSettleTimer);
            nodeTextSettleTimer = null;
            if (nodeTextSettleHandler) {
                el.nodeText.removeEventListener('animationend', nodeTextSettleHandler);
                nodeTextSettleHandler = null;
            }
            el.nodeText.classList.remove('node-text-settle-in');
        }

        function clearNodeTextExitCopies() {
            el.nodeLayer.querySelectorAll('.node-text-exit-copy').forEach(copy => copy.remove());
        }

        function createNodeTextExitCopy() {
            clearNodeTextExitCopies();
            if (!el.nodeText.textContent.trim()) return;
            const copy = el.nodeText.cloneNode(true);
            const layerRect = el.nodeLayer.getBoundingClientRect();
            const textRect = el.nodeText.getBoundingClientRect();
            copy.removeAttribute('id');
            copy.className = 'node-text node-text-exit-copy';
            copy.setAttribute('aria-hidden', 'true');
            copy.style.left = `${textRect.left - layerRect.left}px`;
            copy.style.top = `${textRect.top - layerRect.top}px`;
            copy.style.width = `${textRect.width}px`;
            copy.style.height = `${textRect.height}px`;
            copy.scrollTop = el.nodeText.scrollTop;
            el.nodeLayer.appendChild(copy);
            const remove = () => copy.remove();
            copy.addEventListener('animationend', remove, { once: true });
            setTimeout(remove, 400);
        }

        function finishNodeTextSettle() {
            clearNodeTextSettle();
            sendExperience('TYPE_DONE');
        }

        function renderNode(nodeId, animType = 'fade') {
            // 兜底：清除任何残留的内联样式
            el.nodeLayer.style.opacity = '1';
            el.nodeLayer.style.transform = '';
            el.nodeLayer.style.transition = '';
            el.nodeLayer.classList.remove('fade-in');

            const world = worlds[currentWorldIndex];
            const node = world.data[nodeId];

            if (!node) return;

            // 结局处理
            if (node.isEnding) {
                clearNodeTextExitCopies();
                showEnding(node);
                return;
            }

            clearNodeTextSettle();
            if (animType !== 'settle') clearNodeTextExitCopies();
            sendExperience('TYPE_START');

            // 节点正文直接完整显示，不再逐字输出。
            el.nodeText.className = 'node-text';
            el.nodeText.textContent = node.text;
            el.nodeText.scrollTop = 0;
            if (animType !== 'settle') sendExperience('TYPE_DONE');

            // 方向控制
            const reachableExit = direction => node.exits?.[direction] && world.data[node.exits[direction]] ? node.exits[direction] : null;
            const leftExit = reachableExit('left');
            const rightExit = reachableExit('right');
            const hasExits = leftExit || rightExit;

            if (hasExits) {
                el.dirControls.classList.remove('opacity-0', 'pointer-events-none');
                el.dirControls.inert = false;

                // 更新按钮
                updateDirBtn('btnLeft', 'labelLeft', leftExit, node.labels?.left);
                updateDirBtn('btnRight', 'labelRight', rightExit, node.labels?.right);
            } else {
                el.dirControls.classList.add('opacity-0', 'pointer-events-none');
                el.dirControls.inert = true;
                updateDirBtn('btnLeft', 'labelLeft', null, null);
                updateDirBtn('btnRight', 'labelRight', null, null);
            }
            document.getElementById('mobileBranchHints').hidden = !(leftExit || rightExit);

            if (animType === 'settle') {
                el.nodeText.classList.add('node-text-settle-in');
                nodeTextSettleHandler = () => finishNodeTextSettle();
                el.nodeText.addEventListener('animationend', nodeTextSettleHandler, { once: true });
                nodeTextSettleTimer = setTimeout(finishNodeTextSettle, 500);
            } else if (animType === 'fade') {
                el.nodeLayer.classList.add('fade-in');
                setTimeout(() => el.nodeLayer.classList.remove('fade-in'), 600);
            }

            renderExpMap();
        }

        function updateDirBtn(btnId, labelId, target, label) {
            const btn = document.getElementById(btnId);
            const lbl = document.getElementById(labelId);
            if (btnId === 'btnLeft') document.getElementById('gestureFeedbackLeft').textContent = `将进入：${label || '左侧分支'}`;
            if (btnId === 'btnRight') document.getElementById('gestureFeedbackRight').textContent = `将进入：${label || '右侧分支'}`;
            const mobileChoice = btnId === 'btnLeft' ? document.getElementById('mobileLeftChoice') : btnId === 'btnRight' ? document.getElementById('mobileRightChoice') : null;
            if (mobileChoice) mobileChoice.textContent = target ? `${btnId === 'btnLeft' ? '左滑' : '右滑'} · ${label || (btnId === 'btnLeft' ? '左侧分支' : '右侧分支')}` : '';
            if (target) {
                btn.style.visibility = 'visible';
                lbl.textContent = label || { btnLeft: '向左选择', btnRight: '向右选择' }[btnId];
                btn.disabled = false;
                btn.setAttribute('aria-label', `${label || '选择分支'}，向${{ Left: '左', Right: '右' }[btnId.slice(3)]}进入`);
            } else {
                btn.style.visibility = 'hidden';
                btn.disabled = true;
                lbl.textContent = '';
            }
        }

        function createScreenSnapshot() {
            el.stage.querySelectorAll('.screen-snapshot').forEach(snapshot => snapshot.remove());
            const snapshot = el.stage.cloneNode(true);
            const sourceNodes = [el.stage, ...el.stage.querySelectorAll('*')];
            const snapshotNodes = [snapshot, ...snapshot.querySelectorAll('*')];
            sourceNodes.forEach((source, index) => {
                snapshotNodes[index].scrollTop = source.scrollTop;
                snapshotNodes[index].scrollLeft = source.scrollLeft;
            });
            const snapshotSlides = snapshot.querySelector('#worldSlides');
            const activeSlide = snapshotSlides?.querySelector('.swiper-slide-active') || snapshotSlides?.children[currentWorldIndex];
            if (snapshotSlides && activeSlide) {
                const currentSlide = activeSlide.cloneNode(true);
                currentSlide.style.removeProperty('transform');
                snapshotSlides.replaceChildren(currentSlide);
                snapshotSlides.style.removeProperty('transform');
                snapshotSlides.style.transitionDuration = '0ms';
            }
            snapshot.querySelectorAll('#particlesLayer .particle').forEach(particle => particle.remove());
            snapshot.removeAttribute('id');
            snapshot.classList.remove('is-branch-dragging');
            snapshot.style.removeProperty('--branch-drag-x');
            snapshot.style.removeProperty('--gesture-opacity');
            snapshot.removeAttribute('data-gesture-direction');
            snapshot.querySelectorAll('.is-gesture-target').forEach(element => element.classList.remove('is-gesture-target'));
            snapshot.querySelectorAll('.gesture-feedback').forEach(element => element.remove());
            snapshot.classList.add('screen-snapshot');
            snapshot.setAttribute('aria-hidden', 'true');
            snapshot.inert = true;
            el.stage.appendChild(snapshot);
            return snapshot;
        }

        function clearSwipeFeedback(removeSnapshot = true) {
            el.stage.classList.remove('is-branch-dragging');
            el.stage.style.removeProperty('--gesture-opacity');
            el.stage.removeAttribute('data-gesture-direction');
            document.getElementById('btnLeft').classList.remove('is-gesture-target');
            document.getElementById('btnRight').classList.remove('is-gesture-target');
            if (removeSnapshot) el.stage.querySelectorAll('.screen-snapshot').forEach(snapshot => snapshot.remove());
        }

        function animateScreenSnapshot(snapshot, direction, onComplete = null) {
            if (!snapshot) return;
            el.stage.classList.add('is-screen-swap-pending');
            snapshot.classList.add(`screen-snapshot-${direction}`);
            let removed = false;
            const remove = () => {
                if (removed) return;
                removed = true;
                snapshot.remove();
                if (!el.stage.querySelector('.screen-snapshot')) el.stage.classList.remove('is-screen-swap-pending');
                onComplete?.();
            };
            snapshot.addEventListener('animationend', remove, { once: true });
            setTimeout(remove, 560);
        }

        // ============================================================
        // 方向导航
        // ============================================================
        function handleDirection(dir, swipeSnapshot = null) {
            const rejectSwipe = () => {
                if (swipeSnapshot) clearSwipeFeedback();
            };
            if (experienceMatches('worlds.reading.typing') || experienceMatches('worlds.reading.transitioning') || experienceMatches('worlds.reading.ending')) {
                rejectSwipe();
                return;
            }
            const world = worlds[currentWorldIndex];
            const node = world?.data?.[currentNodeId];

            if (!node || !node.exits || !node.exits[dir]) {
                rejectSwipe();
                return;
            }

            // 原始内容里有未写出的目标节点；界面不得因此进入空白状态。
            if (!world.data[node.exits[dir]]) {
                rejectSwipe();
                showToast('此方向暂不可进入');
                return;
            }

            const snapshot = swipeSnapshot || createScreenSnapshot();
            clearSwipeFeedback(false);
            if (swipeSnapshot) el.stage.classList.add('is-screen-swap-pending');
            sendExperience('MOVE');
            const nextNodeId = node.exits[dir];
            createNodeTextExitCopy();

            // 记录路径
            pathHistory.push(nextNodeId);
            currentNodeId = nextNodeId;

            // 统计步数
            stats.totalSteps++;
            saveStats();

            nodeTransitionTimer = setTimeout(() => {
                sendExperience('NODE_READY');
                renderNode(nextNodeId, 'settle');
                el.stage.classList.remove('is-screen-swap-pending');
                animateScreenSnapshot(snapshot, dir);
                nodeTransitionTimer = null;
            }, 100);
        }

        // ============================================================
        // 结局展示
        // ============================================================
        function showEnding(node) {
            sendExperience('ENDING');
            el.dirControls.inert = true;
            document.getElementById('mobileBranchHints').hidden = true;
            el.endingLayer.classList.remove('hidden');
            document.getElementById('endingTitle').textContent = node.title;
            document.getElementById('endingSummary').textContent = node.summary;

            // 记录结局
            const world = worlds[currentWorldIndex];
            collectEnding(world.id, node.title);
            addFootprint(world.id, node.title);

            // 结局节点加入体验图
            renderExpMap();
        }

        function restartWorld() {
            el.endingLayer.classList.add('hidden');
            enterWorld();
        }

        function exitToCover() {
            loadWorld(currentWorldIndex);
        }

        // ============================================================
        // 体验图渲染
        // ============================================================
        function renderExpMap() {
            const world = worlds[currentWorldIndex];
            const mapEl = el.expMap;

            if (!experienceMatches('worlds.reading')) {
                el.pathProgress.textContent = '未开始';
                el.expSummary.textContent = '尚无足迹';
                mapEl.innerHTML = '<div class="w-full text-center text-white/20 text-xs py-4">— 等待探索 —</div>';
                return;
            }

            el.pathProgress.textContent = `${pathHistory.length} 步`;

            const steps = pathHistory.length;
            const currentNode = world.data[currentNodeId];
            el.expSummary.textContent = currentNode?.isEnding
                ? `抵达结局「${currentNode.title}」`
                : `已走过 ${steps} 个位置`;

            // 渲染圆点序列
            mapEl.innerHTML = pathHistory.map((nid, idx) => {
                const n = world.data[nid];
                const isEnd = n?.isEnding;
                const isLast = idx === pathHistory.length - 1;
                let classes = 'exp-dot';
                if (isLast && !isEnd) classes += ' current';
                else if (isEnd) classes += ' end';
                else classes += ' visited';

                return `<div class="${classes}">${idx + 1}</div>`;
            }).join('');
        }

        // ============================================================
        // 世界切换（滚轮/键盘）
        // ============================================================
        function goToWorld(newIndex, speed = 380) {
            if (newIndex < 0 || newIndex >= worlds.length) {
                if (newIndex < 0) showToast('已经是第一个内容');
                else showToast('已经是最后一个内容');
                return;
            }

            const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
            if (worldSwiper) {
                worldSwiper.allowTouchMove = true;
                worldSwiper.mousewheel?.enable();
                if (worldSwiper.activeIndex === newIndex) {
                    currentWorldIndex = newIndex;
                    loadWorld(newIndex);
                } else {
                    worldSwiper.slideTo(newIndex, reducedMotion ? 0 : speed);
                }
                return;
            }

            currentWorldIndex = newIndex;
            loadWorld(currentWorldIndex);
        }

        function switchWorld(delta) {
            goToWorld(currentWorldIndex + delta);
        }

        function switchWorldByGesture(delta, swipeSnapshot) {
            const nextIndex = currentWorldIndex + delta;
            if (nextIndex < 0 || nextIndex >= worlds.length) {
                clearSwipeFeedback();
                showToast(nextIndex < 0 ? '已经是第一个内容' : '已经是最后一个内容');
                return;
            }

            const snapshot = swipeSnapshot || createScreenSnapshot();
            clearSwipeFeedback(false);
            el.stage.classList.add('is-screen-swap-pending');
            pendingWorldGesture = { snapshot, direction: delta > 0 ? 'up' : 'down' };
            goToWorld(nextIndex, 0);
        }

        function showToast(msg) {
            if (toastTimer) clearTimeout(toastTimer);
            el.toast.textContent = msg;
            el.toast.classList.add('show');
            toastTimer = setTimeout(() => el.toast.classList.remove('show'), 2000);
        }

        // ============================================================
        // 事件监听
        // ============================================================
        function setupEvents() {
            // Swiper 不可用时保留滚轮降级；正文滚动始终优先。
            let wheelAccum = 0;
            let wheelResetTimer = null;
            document.addEventListener('wheel', (e) => {
                if (worldSwiper) return;
                if (currentPage !== 'worlds' || !el.stage.contains(e.target)) return;
                if (experienceMatches('worlds.reading') && (el.nodeText.contains(e.target) || e.deltaY < 0)) return;
                wheelAccum += e.deltaY;
                clearTimeout(wheelResetTimer);
                wheelResetTimer = setTimeout(() => { wheelAccum = 0; }, 180);
                if (Math.abs(wheelAccum) > 72) {
                    clearTimeout(wheelResetTimer);
                    switchWorld(wheelAccum > 0 ? 1 : -1);
                    wheelAccum = 0;
                }
            }, { passive: true });

            // 键盘支持
            document.addEventListener('keydown', (e) => {
                if (currentPage !== 'worlds') {
                    if (e.key === 'Escape') switchPage('worlds');
                    return;
                }

                if (!experienceMatches('worlds.reading')) {
                    if (e.key === 'ArrowDown') switchWorld(1);
                    if (e.key === 'ArrowUp') switchWorld(-1);
                    if (e.key === 'Enter') enterWorld();
                    return;
                }

                if (e.key === 'ArrowLeft') { e.preventDefault(); handleDirection('left'); }
                if (e.key === 'ArrowRight') { e.preventDefault(); handleDirection('right'); }
                if (e.key === 'ArrowUp') { e.preventDefault(); switchWorld(1); }
                if (e.key === 'ArrowDown') { e.preventDefault(); switchWorld(-1); }
                if (e.key === 'Escape') exitToCover();
            });

            // 触摸支持（更精确的区分）
            let touchStartY = 0;
            let touchStartX = 0;
            let touchStarted = false;
            let touchIgnored = false;
            let touchStartedInText = false;
            let touchStartTextScrollTop = 0;
            let touchSnapshot = null;
            let touchStageWidth = 0;
            let touchStageHeight = 0;
            const clearTouchGesture = () => {
                touchStarted = false;
                touchIgnored = false;
                touchStartedInText = false;
                touchSnapshot = null;
                clearSwipeFeedback();
            };

            el.stage.addEventListener('touchstart', (e) => {
                if (e.touches.length !== 1) {
                    clearTouchGesture();
                    return;
                }
                const touchTarget = e.target instanceof Element ? e.target : e.target.parentElement;
                touchStartY = e.touches[0].clientY;
                touchStartX = e.touches[0].clientX;
                touchStarted = true;
                touchIgnored = Boolean(touchTarget?.closest('button, input, textarea, select'));
                touchStartedInText = Boolean(touchTarget?.closest('.node-text'));
                touchStartTextScrollTop = touchStartedInText ? el.nodeText.scrollTop : 0;
                const stageBounds = el.stage.getBoundingClientRect();
                touchStageWidth = stageBounds.width;
                touchStageHeight = stageBounds.height;
            }, { passive: true });

            el.stage.addEventListener('touchmove', (e) => {
                if (!touchStarted || touchIgnored) return;
                if (e.touches.length !== 1 || currentPage !== 'worlds' || !experienceMatches('worlds.reading')) {
                    clearTouchGesture();
                    return;
                }
                const dx = e.touches[0].clientX - touchStartX;
                const dy = e.touches[0].clientY - touchStartY;
                const vertical = Math.abs(dy) >= 10 && Math.abs(dy) > Math.abs(dx);
                if (touchStartedInText && vertical) {
                    const maxScrollTop = Math.max(0, el.nodeText.scrollHeight - el.nodeText.clientHeight);
                    const textScroll = resolveTextTouchScroll(touchStartTextScrollTop, dy, maxScrollTop);
                    if (textScroll.handled) {
                        el.nodeText.scrollTop = textScroll.scrollTop;
                        touchSnapshot = null;
                        clearSwipeFeedback();
                        return;
                    }
                }
                const world = worlds[currentWorldIndex];
                const node = world?.data?.[currentNodeId];
                const horizontal = Math.abs(dx) >= 10 && Math.abs(dx) > Math.abs(dy);
                let direction = null;
                if (horizontal) direction = dx > 0 ? 'right' : 'left';
                else if (vertical && dy < 0) {
                    const textCanScroll = touchStartedInText && el.nodeText.scrollHeight > el.nodeText.clientHeight + 1;
                    const atTextBottom = el.nodeText.scrollTop + el.nodeText.clientHeight >= el.nodeText.scrollHeight - 1;
                    if (!textCanScroll || atTextBottom) direction = 'up';
                } else if (vertical && dy > 0) {
                    const textCanScroll = touchStartedInText && el.nodeText.scrollHeight > el.nodeText.clientHeight + 1;
                    const atTextTop = el.nodeText.scrollTop <= 1;
                    if (!textCanScroll || atTextTop) direction = 'down';
                }

                if (direction === 'up' || direction === 'down') {
                    const nextIndex = currentWorldIndex + (direction === 'up' ? 1 : -1);
                    if (nextIndex < 0 || nextIndex >= worlds.length) direction = null;
                } else if (!direction || !node?.exits?.[direction] || !world.data[node.exits[direction]]) {
                    direction = null;
                }

                if (!direction) {
                    touchSnapshot = null;
                    clearSwipeFeedback();
                    return;
                }

                if (!touchSnapshot) touchSnapshot = createScreenSnapshot();
                el.stage.classList.add('is-branch-dragging');
                el.stage.dataset.gestureDirection = direction;
                if (direction === 'up' || direction === 'down') {
                    touchSnapshot.classList.remove('is-light-flow');
                    touchSnapshot.removeAttribute('data-gesture-direction');
                    ['--flow-opacity', '--flow-x', '--flow-y', '--flow-rotation'].forEach(property => touchSnapshot.style.removeProperty(property));
                } else {
                    const progress = Math.min(1, Math.max(Math.abs(dx), Math.abs(dy)) / Math.max(1, Math.min(touchStageWidth, touchStageHeight) * .58));
                    touchSnapshot.classList.add('is-light-flow');
                    touchSnapshot.dataset.gestureDirection = direction;
                    touchSnapshot.style.setProperty('--flow-opacity', String(progress * .92));
                    touchSnapshot.style.setProperty('--flow-x', `${direction === 'left' ? -touchStageWidth * .54 * progress : direction === 'right' ? touchStageWidth * .54 * progress : 0}px`);
                    touchSnapshot.style.setProperty('--flow-y', `${direction === 'up' ? -touchStageHeight * .54 * progress : 0}px`);
                    touchSnapshot.style.setProperty('--flow-rotation', direction === 'up' ? '90deg' : '0deg');
                }
                touchSnapshot.style.transform = `translate3d(${dx}px, ${dy}px, 0)`;
                document.getElementById('btnLeft').classList.toggle('is-gesture-target', direction === 'left');
                document.getElementById('btnRight').classList.toggle('is-gesture-target', direction === 'right');
            }, { passive: true });

            el.stage.addEventListener('touchend', (e) => {
                if (!touchStarted) return;
                if (e.changedTouches.length !== 1 || e.touches.length !== 0) {
                    clearTouchGesture();
                    return;
                }
                touchStarted = false;
                if (touchIgnored) {
                    clearTouchGesture();
                    return;
                }

                const dx = e.changedTouches[0].clientX - touchStartX;
                const dy = e.changedTouches[0].clientY - touchStartY;
                const absDx = Math.abs(dx);
                const absDy = Math.abs(dy);

                if (currentPage !== 'worlds') {
                    clearTouchGesture();
                    return;
                }

                if (!experienceMatches('worlds.reading')) {
                    clearTouchGesture();
                    if (worldSwiper) return;
                    // 封面模式：上下滑动切换世界
                    if (absDy > 72 && absDy > absDx) {
                        switchWorld(dy < 0 ? 1 : -1);
                    }
                    return;
                }

                if (touchStartedInText) {
                    const textDidScroll = Math.abs(el.nodeText.scrollTop - touchStartTextScrollTop) > 1;
                    if (textDidScroll) {
                        clearTouchGesture();
                        return;
                    }
                    const textCanScroll = el.nodeText.scrollHeight > el.nodeText.clientHeight + 1;
                    const atTextTop = el.nodeText.scrollTop <= 1;
                    const atTextBottom = el.nodeText.scrollTop + el.nodeText.clientHeight >= el.nodeText.scrollHeight - 1;
                    const gestureMovesIntoText = (dy < 0 && !atTextBottom) || (dy > 0 && !atTextTop);
                    if (textCanScroll && gestureMovesIntoText) {
                        clearTouchGesture();
                        return;
                    }
                }

                // 正文可纵向滚动；横向划动仍可从正文上选择左右分支。
                if (absDx > absDy && absDx > 52) {
                    const direction = dx > 0 ? 'right' : 'left';
                    const snapshot = touchSnapshot;
                    touchSnapshot = null;
                    handleDirection(direction, snapshot);
                    touchStartedInText = false;
                    return;
                }

                // 正文中：纵向手势只切换作品；故事分支只使用左右。
                if (absDy > absDx && absDy > 52 && dy < 0) {
                    const snapshot = touchSnapshot;
                    touchSnapshot = null;
                    switchWorldByGesture(1, snapshot);
                } else if (absDy > absDx && absDy > 52 && dy > 0) {
                    const snapshot = touchSnapshot;
                    touchSnapshot = null;
                    switchWorldByGesture(-1, snapshot);
                } else {
                    clearTouchGesture();
                }
                touchStartedInText = false;
            }, { passive: true });

            el.stage.addEventListener('touchcancel', () => {
                clearTouchGesture();
            }, { passive: true });

            el.searchInput.addEventListener('input', event => renderSearchResults(event.target.value));
        }

        function toggleLike(btn) {
            const world = worlds[currentWorldIndex];
            const isLiked = isBookmarked(world.id);

            if (isLiked) {
                removeBookmark(world.id);
                showToast('已取消收藏');
            } else {
                addBookmark(world.id);
                showToast('已添加到收藏');
            }

            updateLikeButton();
            updateProfileStats();
        }

        // 启动
        init();
    </script>


</body></html>
