<!DOCTYPE html><html lang="zh-CN"><head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
    <title>信息雨</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@14.2.0/swiper-bundle.min.css"/>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/xstate@5.33.2/dist/xstate.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/swiper@14.2.0/swiper-bundle.min.js"></script>
    <script src="./content-pool/registry.generated.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            isolation: isolate;
            font-family: 'Inter', 'Noto Serif SC', serif;
            background: #0a0a0f;
            color: #fff;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
        }

        button:focus-visible, [role="button"]:focus-visible, .nav-item:focus-visible {
            outline: 2px solid #b3c2ff;
            outline-offset: 3px;
        }

        /* 9:16 mobile-native content stage */
        .stage-shell {
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 0;
            background: transparent;
        }

        #worldsPage {
            isolation: isolate;
            background: transparent;
            --info-rail-width: clamp(320px, 24vw, 400px);
            --info-rail-right-gap: clamp(32px, 5vw, 84px);
        }

        .world-ambient-backdrop {
            position: fixed;
            inset: 0;
            z-index: 0;
            overflow: hidden;
            pointer-events: none;
            background: #0a0e15;
            visibility: hidden;
        }

        body.worlds-active .world-ambient-backdrop { visibility: visible; }
        main { z-index: 1; background: transparent !important; }

        .world-ambient-art {
            position: absolute;
            inset: -48px;
            background-position: center;
            background-size: cover;
            background-repeat: no-repeat;
            filter: blur(40px) saturate(0.9);
            transform: scale(1.02);
            opacity: 0;
            transition: opacity 320ms ease;
        }

        .world-ambient-art.is-visible { opacity: 1; }

        .world-ambient-tint {
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg,
                rgba(8,13,23,0.62) 0%,
                rgba(17,24,32,0.50) 50%,
                rgba(8,13,23,0.62) 100%);
        }

        /* Home feed: lightweight, borderless masonry inspired by PeerTube's video listing flow. */
        #homePage {
            isolation: isolate;
            overscroll-behavior: contain;
            scrollbar-width: thin;
            scrollbar-color: rgba(255,255,255,0.18) transparent;
        }

        #homePage::before {
            content: '';
            position: fixed;
            inset: 0;
            z-index: -1;
            pointer-events: none;
            background: linear-gradient(135deg, rgba(8,13,23,0.28), rgba(17,24,32,0.24)),
                        url('./design/home-tab-ambient.jpg') center / cover no-repeat;
        }

        .home-feed-shell {
            width: min(100%, 1720px);
            margin: 0 auto;
            padding: 26px clamp(24px, 2.6vw, 48px) 64px;
        }

        .home-feed-header {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            gap: 28px;
            margin-bottom: 24px;
        }

        .home-feed-header h1 {
            font-family: 'Noto Serif SC', serif;
            font-size: 28px;
            font-weight: 600;
            letter-spacing: 0.02em;
        }

        .home-feed-header p { margin-top: 5px; color: rgba(255,255,255,0.58); font-size: 13px; }

        .home-search {
            display: flex;
            align-items: center;
            gap: 10px;
            width: min(340px, 34vw);
            padding: 0 0 7px;
            color: rgba(255,255,255,0.54);
        }

        .home-search svg { width: 18px; height: 18px; flex: none; }
        .home-search input { width: 100%; border: 0; outline: 0; background: transparent; color: #fff; font-size: 13px; }
        .home-search input::placeholder { color: rgba(255,255,255,0.48); }

        .home-filter-row {
            display: flex;
            gap: 22px;
            align-items: center;
            overflow-x: auto;
            padding: 0 0 17px;
            margin-bottom: 2px;
            scrollbar-width: none;
        }
        .home-filter-row::-webkit-scrollbar { display: none; }
        .home-filter-button {
            flex: none;
            padding: 0;
            border: 0;
            background: transparent;
            color: rgba(255,255,255,0.62);
            font-size: 12px;
            cursor: pointer;
            transition: color 160ms ease;
        }
        .home-filter-button:hover, .home-filter-button.active { color: #f0d79d; }

        .home-feed-status { min-height: 18px; margin: 0 0 12px; color: rgba(255,255,255,0.42); font-size: 11px; }
        .home-masonry { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; align-items: start; }
        .home-masonry-column { display: flex; flex-direction: column; gap: 16px; min-width: 0; }

        .home-world-card {
            position: relative;
            display: block;
            width: 100%;
            overflow: hidden;
            padding: 0;
            border: 0;
            border-radius: 16px;
            background: #11151d;
            color: #fff;
            text-align: left;
            cursor: pointer;
            isolation: isolate;
        }
        .home-world-card:focus-visible { outline: 2px solid rgba(240,215,157,0.9); outline-offset: 3px; }
        .home-world-card img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transition: transform 420ms cubic-bezier(.2,.7,.2,1); }
        .home-world-card:hover img { transform: scale(1.035); }
        .home-world-card::after {
            content: '';
            position: absolute;
            inset: 28% 0 0;
            z-index: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.88), rgba(0,0,0,0.42) 54%, transparent);
            pointer-events: none;
        }
        .home-world-copy { position: absolute; inset: auto 18px 17px; z-index: 1; pointer-events: none; }
        .home-world-title { font: 600 20px/1.35 'Noto Serif SC', serif; text-shadow: 0 1px 12px rgba(0,0,0,0.42); }
        .home-world-meta { display: flex; justify-content: space-between; gap: 12px; margin-top: 5px; color: rgba(255,255,255,0.76); font-size: 11px; }
        .home-world-desc { display: -webkit-box; overflow: hidden; margin-top: 6px; color: rgba(255,255,255,0.88); font-size: 11px; line-height: 1.55; -webkit-box-orient: vertical; -webkit-line-clamp: 2; }
        .home-feed-empty { grid-column: 1 / -1; padding: 72px 20px; color: rgba(255,255,255,0.6); text-align: center; font-size: 13px; }
        .home-feed-sentinel { height: 2px; }

        @media (max-width: 1100px) {
            .home-feed-shell { padding-inline: 24px; }
            .home-masonry { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        }

        @media (max-width: 768px) {
            #homePage { -webkit-overflow-scrolling: touch; }
            .home-feed-shell { padding: 18px 16px calc(78px + env(safe-area-inset-bottom)); }
            .home-feed-header { align-items: stretch; flex-direction: column; gap: 12px; margin-bottom: 14px; }
            .home-feed-header h1 { font-size: 24px; }
            .home-feed-header p { font-size: 12px; line-height: 1.55; }
            .home-search {
                width: 100%;
                min-height: 44px;
                padding: 0 12px;
                border-radius: 12px;
                background: rgba(255,255,255,0.065);
            }
            .home-search input { min-width: 0; min-height: 44px; }
            .home-filter-row { gap: 20px; padding: 0 0 12px; }
            .home-filter-button { min-height: 36px; }
            .home-feed-status { margin-bottom: 10px; }
            .home-masonry { grid-template-columns: minmax(0, 1fr); gap: 14px; }
            .home-masonry-column { gap: 14px; }
            .home-world-card { border-radius: 18px; }
            .home-world-card:hover img { transform: none; }
            .home-world-copy { inset: auto 16px 16px; }
            .home-world-title { font-size: 18px; line-height: 1.4; }
            .home-world-meta, .home-world-desc { font-size: 12px; }
            .home-world-desc { line-height: 1.6; }
        }

        .stage-shell,
        .sidebar-right {
            position: relative;
            z-index: 1;
        }

        @media (min-width: 769px) {
            /* Keep the 9:16 stage centered in the viewport, not in the leftover column. */
            .world-stage {
                transform: translateX(calc((var(--info-rail-width) + var(--info-rail-right-gap) - 84px) / 2));
            }
        }

        .world-stage {
            position: relative;
            width: min(100%, calc(45dvh), 532px);
            height: auto;
            aspect-ratio: 9 / 16;
            overflow: hidden;
            border-radius: 12px;
            flex: none;
            box-shadow: 0 24px 80px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.08);
        }

        @media (max-width: 768px) {
            /* 阅读中的纵向手势由页面统一判定；正文滚动也由触摸处理器管理。 */
            .world-stage.is-reading { touch-action: none; overscroll-behavior: none; }
        }

        .world-stage[data-text-size="sm"] { --reading-font-size: 14px; --reading-line-height: 1.88; --reading-shade-start: 80%; }
        .world-stage[data-text-size="md"] { --reading-font-size: 16px; --reading-line-height: 1.78; --reading-shade-start: 84%; }
        .world-stage[data-text-size="lg"] { --reading-font-size: 18px; --reading-line-height: 1.68; --reading-shade-start: 88%; }

        .world-swiper {
            position: absolute;
            inset: 0;
            z-index: 0;
            width: 100%;
            height: 100%;
            display: none;
            background: #111118;
        }

        .world-stage.swiper-ready .world-swiper { display: block; }
        .world-stage.swiper-ready .ambience-layer { opacity: 0; }

        .world-swiper .swiper-wrapper,
        .world-swiper .swiper-slide {
            width: 100%;
            height: 100%;
        }

        .world-slide-image {
            position: absolute;
            inset: 0;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        .world-slide-image::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.36), transparent 48%);
        }

        /* Ambience Layer */
        .ambience-layer {
            position: absolute;
            inset: 0;
            transition: all 0.8s ease;
            z-index: 0;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        /* Floating Particles */
        .particle {
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
            animation: float 15s infinite ease-in-out;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) translateX(0); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-100vh) translateX(20px); opacity: 0; }
        }

        /* Cover Layer */
        .cover-layer {
            position: absolute;
            inset: 0;
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 2rem 2rem 6.25rem;
            background: linear-gradient(to top, rgba(0,0,0,0.94) 0%, rgba(0,0,0,0.72) 30%, rgba(0,0,0,0.34) 55%, transparent 78%);
            pointer-events: none;
            transition: opacity 0.18s ease;
        }

        .world-stage.is-swiping .cover-layer { opacity: 0; }

        /* Node Content */
        .node-content {
            position: absolute;
            inset: 0;
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 1.5rem;
            padding-bottom: 7rem;
            background: linear-gradient(to top, rgba(0,0,0,0.98) 0%, rgba(0,0,0,0.92) 18%, rgba(0,0,0,0.8) 38%, rgba(0,0,0,0.52) 62%, rgba(0,0,0,0.2) var(--reading-shade-start, 84%), transparent 100%);
            pointer-events: none;
        }

        .node-text {
            position: relative;
            z-index: 1;
            flex: 0 1 auto;
            min-height: 0;
            max-height: min(58%, calc(100% - 7rem));
            font-size: var(--reading-font-size, 16px);
            line-height: var(--reading-line-height, 1.78);
            color: rgba(255,255,255,0.95);
            text-shadow: 0 2px 8px rgba(0,0,0,0.6);
            overflow-y: auto;
            overscroll-behavior: contain;
            touch-action: pan-y;
            white-space: pre-line;
            pointer-events: auto;
            scrollbar-width: thin;
            scrollbar-color: rgba(255,255,255,0.24) transparent;
        }

        .node-text-settle-in {
            animation: nodeTextSettleIn 330ms cubic-bezier(.2,.75,.25,1) both;
        }

        .node-text-exit-copy {
            position: absolute;
            z-index: 2;
            flex: none;
            margin: 0;
            overflow: hidden;
            pointer-events: none;
            scrollbar-width: none;
            animation: nodeTextLeave 210ms ease-in both;
        }

        .node-text-exit-copy::-webkit-scrollbar { display: none; }

        @keyframes nodeTextLeave {
            to { opacity: 0; transform: translateY(-6px); }
        }

        @keyframes nodeTextSettleIn {
            from { opacity: 0; transform: translateY(7px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Direction Controls */
        .dir-controls {
            position: absolute;
            bottom: 1.2rem;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 2rem;
            z-index: 20;
        }

        .dir-controls[inert], #btnExit[inert] { visibility: hidden; }

        .dir-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.25rem;
            cursor: pointer;
            transition: all 0.3s ease;
            padding: 0.5rem;
            border: 0;
            background: transparent;
            color: inherit;
        }

        .dir-btn:active { transform: scale(0.9); }

        .dir-btn .icon {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: rgba(255,255,255,0.12);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            transition: all 0.3s ease;
        }

        .dir-btn:hover .icon {
            background: rgba(255,255,255,0.25);
            transform: translateY(-2px);
        }

        .dir-btn .label {
            font-size: 10px;
            color: rgba(255,255,255,0.6);
            max-width: 80px;
            text-align: center;
            line-height: 1.2;
        }

        .dir-btn.is-gesture-target .icon {
            background: rgba(229, 206, 154, 0.3);
            color: #fff4d6;
            transform: scale(1.08);
        }

        .gesture-feedback {
            position: absolute;
            z-index: 70;
            top: 50%;
            display: flex;
            align-items: center;
            gap: 8px;
            max-width: 42%;
            padding: 9px 12px;
            color: rgba(255,255,255,.96);
            background: rgba(6,9,13,.56);
            backdrop-filter: blur(12px);
            font-size: 12px;
            line-height: 1.4;
            opacity: 0;
            pointer-events: none;
            transition: opacity 100ms linear;
        }
        .gesture-feedback.left { left: 10px; transform: translateY(-50%); }
        .gesture-feedback.right { right: 10px; transform: translateY(-50%); }
        /* 分支拖动只用故事画面里的光流回应，不再弹出独立的文字提示框。 */
        .world-stage.is-branch-dragging .gesture-feedback { display: none; }
        .world-stage.is-branch-dragging > #nodeLayer { opacity: 0; }
        .world-stage.is-branch-dragging > #mobileBranchHints { opacity: 0; }
        .world-stage.is-branch-dragging > :not(.screen-snapshot):not(.gesture-feedback),
        .world-stage.is-screen-swap-pending > :not(.screen-snapshot):not(.gesture-feedback) { opacity: 0 !important; pointer-events: none !important; }
        .world-stage.is-branch-dragging > .ambience-layer,
        .world-stage.is-screen-swap-pending > .ambience-layer { opacity: 1 !important; }
        .world-stage.is-screen-swap-pending { pointer-events: none; }
        .gesture-feedback.up { top: 16%; left: 50%; transform: translateX(-50%); white-space: nowrap; }
        .gesture-feedback.down { top: auto; bottom: 16%; left: 50%; transform: translateX(-50%); white-space: nowrap; }
        .mobile-branch-hints { display: none; }
        .world-stage.is-branch-dragging[data-gesture-direction="left"] > #mobileBranchHints #mobileLeftChoice,
        .world-stage.is-branch-dragging[data-gesture-direction="right"] > #mobileBranchHints #mobileRightChoice { color: #fff1cc; opacity: 1; }
        .world-stage.is-branch-dragging[data-gesture-direction="up"] > #mobileBranchHints #mobileUpChoice { color: #fff1cc; opacity: 1; }
        .world-stage.is-branch-dragging[data-gesture-direction="left"] > #mobileBranchHints #mobileRightChoice,
        .world-stage.is-branch-dragging[data-gesture-direction="right"] > #mobileBranchHints #mobileLeftChoice { opacity: .42; }

        .screen-snapshot {
            position: absolute !important;
            inset: 0 !important;
            z-index: 60 !important;
            width: 100% !important;
            height: 100% !important;
            aspect-ratio: auto !important;
            box-shadow: none !important;
            pointer-events: none !important;
            animation-duration: 460ms;
            animation-timing-function: cubic-bezier(.2,.78,.22,1);
            animation-fill-mode: forwards;
            will-change: transform, opacity;
        }
        .screen-snapshot.is-light-flow { overflow: hidden !important; }
        .screen-snapshot.is-light-flow::after {
            content: "";
            position: absolute;
            z-index: 80;
            top: 50%;
            left: 50%;
            width: 76%;
            height: 25%;
            border-radius: 50%;
            pointer-events: none;
            opacity: var(--flow-opacity, 0);
            background:
                radial-gradient(ellipse at center, rgba(255,246,215,.58) 0%, rgba(255,222,160,.32) 22%, rgba(255,205,128,.12) 48%, transparent 76%),
                linear-gradient(90deg, transparent 27%, rgba(255,227,175,.03) 42%, rgba(255,226,167,.20) 49%, rgba(255,249,222,.42) 50%, rgba(255,221,157,.16) 53%, transparent 70%);
            mix-blend-mode: screen;
            transform: translate3d(var(--flow-x, 0px), var(--flow-y, 0px), 0) translate(-50%, -50%) rotate(var(--flow-rotation, 0deg));
            will-change: transform, opacity;
        }
        .screen-snapshot.is-light-flow[data-gesture-direction="up"]::after { width: 48%; height: 38%; }
        .screen-snapshot-left { animation-name: screen-swipe-left; }
        .screen-snapshot-right { animation-name: screen-swipe-right; }
        .screen-snapshot-up { animation-name: screen-swipe-up; }
        .screen-snapshot-down { animation-name: screen-swipe-down; }
        @keyframes screen-swipe-left { to { transform: translate3d(-100%,0,0); opacity: .92; } }
        @keyframes screen-swipe-right { to { transform: translate3d(100%,0,0); opacity: .92; } }
        @keyframes screen-swipe-up { to { transform: translate3d(0,-100%,0); opacity: .92; } }
        @keyframes screen-swipe-down { to { transform: translate3d(0,100%,0); opacity: .92; } }
        @media (prefers-reduced-motion: reduce) { .screen-snapshot { animation-duration: 1ms; } }

        /* Ending Overlay */
        .ending-overlay {
            position: absolute;
            inset: 0;
            z-index: 30;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(0,0,0,0.88);
            backdrop-filter: blur(20px);
            padding: 2rem;
            text-align: center;
        }

        .ending-overlay h2 {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, #fff 0%, rgba(255,255,255,0.7) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .ending-overlay p {
            font-size: 0.875rem;
            color: rgba(255,255,255,0.7);
            max-width: 300px;
            line-height: 1.6;
            margin-bottom: 2rem;
        }

        .ending-actions {
            display: flex;
            gap: 1rem;
        }

        .btn-primary {
            padding: 0.625rem 1.5rem;
            border-radius: 9999px;
            background: rgba(255,255,255,0.15);
            border: 1px solid rgba(255,255,255,0.2);
            color: #fff;
            font-size: 0.875rem;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .btn-primary:hover { background: rgba(255,255,255,0.25); transform: translateY(-1px); }

        /* Sidebar Right */
        .sidebar-right {
            width: var(--info-rail-width);
            min-width: var(--info-rail-width);
            margin-right: var(--info-rail-right-gap);
            padding: clamp(128px, 18vh, 170px) clamp(24px, 4.65vw, 78px) 28px 0;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            scrollbar-width: none;
            color: rgba(255,255,255,0.84);
        }

        .sidebar-right::-webkit-scrollbar { display: none; }
        .sidebar-right h3 { color: rgba(255,255,255,0.42); font-size: 11px; font-weight: 400; letter-spacing: 0.02em; }
        .info-author { margin-bottom: 38px; }
        .info-author h3 { margin-bottom: 12px; }
        .info-author-name { font-size: 14px; color: rgba(255,255,255,0.94); }
        .info-avatar { display: none; }
        .info-actions { display: flex; align-items: center; gap: 48px; margin-bottom: 56px; }
        .info-action {
            border: 0;
            padding: 0;
            background: transparent;
            color: rgba(255,255,255,0.82);
            font: inherit;
            font-size: 12px;
            cursor: pointer;
        }
        .info-action .info-like-heart { color: #f1ca84; font-size: 16px; margin-right: 8px; }
        .info-action[disabled] { color: rgba(255,255,255,0.36); cursor: not-allowed; }
        .info-experience { min-height: 126px; }
        .info-experience h3 { margin-bottom: 8px; }
        .info-progress { font-size: 12px; color: rgba(255,255,255,0.78); }
        .info-experience .exp-map-container { margin: 18px 0 0; padding: 0; background: transparent; }
        .exp-map-container > p { display: none; }
        .info-experience .exp-map { justify-content: flex-start; gap: 8px; margin-top: 0; max-height: 96px; }
        .info-experience .exp-map > div.w-full { padding: 0 !important; color: rgba(255,255,255,0.42) !important; text-align: left !important; background: transparent !important; }
        .info-experience .exp-dot { width: 20px; height: 20px; font-size: 9px; background: rgba(255,255,255,0.09); border: 1px solid rgba(255,255,255,0.18); }

        /* Experience Map */
        .exp-map-container {

        .exp-map {

            flex-wrap: wrap;
            gap: 0.375rem;
            margin-top: 0.75rem;
            max-height: 200px;
            overflow-y: auto;
        }

        .exp-dot {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .exp-dot.visited {
            background: rgba(255,255,255,0.15);
            color: rgba(255,255,255,0.7);
            border: 1px solid rgba(255,255,255,0.1);
        }

        .exp-dot.current {
            background: rgba(255,255,255,0.9);
            color: #000;
            border: 2px solid rgba(255,255,255,1);
            box-shadow: 0 0 10px rgba(255,255,255,0.3);
            animation: pulse-dot 2s infinite;
        }

        .exp-dot.end {
            background: linear-gradient(135deg, #f59e0b, #ef4444);
            color: #fff;
            border: none;
        }

        @keyframes pulse-dot {
            0%, 100% { box-shadow: 0 0 0 0 rgba(255,255,255,0.4); }
            50% { box-shadow: 0 0 0 8px rgba(255,255,255,0); }
        }

        /* Navigation Dots */
        .world-dots {
            position: absolute;
            left: 1rem;
            top: 1rem;
            display: flex;
            align-items: center;
            gap: 0.55rem;
            z-index: 50;
            padding: 0.45rem 0.7rem;
            border: 1px solid rgba(255,255,255,0.16);
            border-radius: 999px;
            background: rgba(5,7,15,0.58);
            backdrop-filter: blur(12px);
            color: rgba(255,255,255,0.78);
            font: 600 11px/1 'Inter', sans-serif;
            font-variant-numeric: tabular-nums;
        }

        .world-progress {
            width: 42px;
            height: 2px;
            border-radius: 2px;
            overflow: hidden;
            background: rgba(255,255,255,0.22);
        }

        .world-progress > span {
            display: block;
            height: 100%;
            background: #b3c2ff;
            transition: width 0.25s ease;
        }

        .stage-save {
            position: absolute;
            top: 1rem;
            right: 1rem;
            z-index: 45;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(255,255,255,0.18);
            border-radius: 50%;
            background: rgba(5,7,15,0.58);
            backdrop-filter: blur(12px);
            color: white;
            font-size: 22px;
            cursor: pointer;
        }
        .stage-save.hidden { display: none; }

        /* Animations */
        .fade-in { animation: fadeIn 0.5s ease forwards; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* Toast */
        .toast {
            position: fixed;
            top: 2rem;
            left: 50%;
            transform: translateX(-50%) translateY(-20px);
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 0.75rem 1.5rem;
            border-radius: 9999px;
            font-size: 0.875rem;
            z-index: 1000;
            opacity: 0;
            transition: all 0.3s ease;
            pointer-events: none;
            white-space: nowrap;
        }

        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 2px; }

        /* Nav Item Active */
        .nav-item {
            transition: color 0.2s ease;
            cursor: pointer;
            border-radius: 0;
            border: 0;
            background: transparent;
            font: inherit;
            justify-content: flex-start !important;
            padding-left: 12px;
            color: rgba(255,255,255,0.68);
            text-align: left;
            height: 40px !important;
            aspect-ratio: auto !important;
        }

        .sidebar-left { border: 0; }
        .sidebar-left nav { gap: 8px; }
        .sidebar-left > div:last-child button:first-child svg { display: none; }
        .sidebar-left > div:last-child button:first-child::after { content: '设置'; }
        .nav-item svg { display: none; }
        .nav-item span { font-size: 12px !important; }
        .nav-item:hover { color: #fff; background: transparent; }
        .nav-item.active { background: transparent; color: #e9c982; box-shadow: none; }
        #leftNav .nav-item.active:focus-visible { outline: none; }

        /* Enter Button on Cover */
        .stage-enter {
            position: absolute;
            left: 2rem;
            bottom: 2rem;
            z-index: 18;
        }

        .enter-btn {
            padding: 0.5rem 1.5rem;
            border-radius: 9999px;
            background: rgba(255,255,255,0.2);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.25);
            color: #fff;
            font-size: 0.875rem;
            cursor: pointer;
            transition: all 0.3s ease;
            pointer-events: auto;
        }

        .enter-btn:hover { background: rgba(255,255,255,0.3); transform: scale(1.05); }

        /* Bookmark Page */
        .bookmark-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 1rem;
            padding: 1rem;
            overflow-y: auto;
            max-height: calc(100vh - 80px);
        }

        .bookmark-card {
            display: block;
            width: 100%;
            color: inherit;
            text-align: left;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 12px;
            padding: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .bookmark-card:hover {
            background: rgba(255,255,255,0.08);
            transform: translateY(-2px);
            border-color: rgba(255,255,255,0.15);
        }

        /* Profile Page */
        .profile-header {
            padding: 1.5rem 1.5rem 1rem;
            border-bottom: 1px solid rgba(255,255,255,0.06);
        }

        .stat-card {
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 10px;
            padding: 1rem;
            text-align: center;
            transition: all 0.3s ease;
        }

        .stat-card:hover { background: rgba(255,255,255,0.07); }

        .setting-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1rem 1.5rem;
            border-bottom: 1px solid rgba(255,255,255,0.04);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .setting-item:hover { background: rgba(255,255,255,0.03); }

        /* Toggle Switch */
        .toggle {
            width: 44px;
            height: 24px;
            border-radius: 12px;
            background: rgba(255,255,255,0.15);
            position: relative;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .toggle.on { background: #10b981; }

        .toggle::after {
            content: '';
            position: absolute;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #fff;
            top: 2px;
            left: 2px;
            transition: all 0.3s ease;
        }

        .toggle.on::after { left: 22px; }

        /* Mobile Responsive */
        @media (max-width: 768px) {
            .sidebar-left {
                position: fixed;
                inset: auto 0 0;
                z-index: 100;
                width: 100% !important;
                min-width: 0 !important;
                height: calc(58px + env(safe-area-inset-bottom));
                padding: 4px 8px env(safe-area-inset-bottom) !important;
                flex-direction: row;
                border: 0;
                background: rgba(10,10,15,0.55);
                -webkit-backdrop-filter: blur(16px) saturate(125%);
                backdrop-filter: blur(16px) saturate(125%);
            }
            .sidebar-left > div:first-child, .sidebar-left > div:last-child { display: none; }
            .sidebar-left nav { flex-direction: row; gap: 0; width: 100%; padding: 0; }
            .sidebar-left .nav-item {
                flex: 1 1 0;
                width: auto;
                min-width: 0;
                height: 48px;
                padding: 0 2px;
                justify-content: center !important;
                text-align: center;
            }
            .sidebar-left .nav-item span { white-space: nowrap; font-size: 11px !important; line-height: 1.2; }
            .sidebar-left .nav-item.active { color: #f0d79d; font-weight: 600; }
            .stage-shell {
                display: grid;
                place-items: center;
                min-width: 0;
                min-height: 0;
                padding: 0 0 calc(58px + env(safe-area-inset-bottom)) !important;
                background: #05060a;
            }
            .world-stage {
                width: min(100%, calc(56.25dvh - 40px));
                border-radius: 0;
            }
            @supports (width: 1cqh) {
                .stage-shell { container-type: size; }
                .world-stage { width: min(100cqw, 56.25cqh); }
            }
            .sidebar-right { display: none; }
            .node-text { max-height: min(58%, calc(100% - 7rem)); touch-action: none; }
            .dir-controls { display: none !important; }
            .mobile-branch-hints:not([hidden]) {
                position: absolute;
                z-index: 20;
                right: 10px;
                bottom: 12px;
                left: 10px;
                display: grid;
                grid-template-columns: minmax(0,1fr) auto minmax(0,1fr);
                align-items: end;
                gap: 5px;
                color: rgba(255,255,255,.82);
                pointer-events: none;
                text-shadow: 0 1px 8px rgba(0,0,0,.8);
            }
            #mobileLeftChoice, #mobileRightChoice { max-width: 100%; font-size: 11px; line-height: 1.35; }
            #mobileUpChoice { max-width: 34vw; font-size: 10px; line-height: 1.25; white-space: normal; text-align: center; }
            #mobileLeftChoice { text-align: left; }
            #mobileRightChoice { text-align: right; }
            .mobile-swipe-instruction { color: rgba(255,255,255,.45); font-size: 9px; white-space: nowrap; }
            main > div:not(#worldsPage) { padding-bottom: calc(58px + env(safe-area-inset-bottom)); }
            .bookmark-grid { grid-template-columns: minmax(0, 1fr); gap: 12px; max-height: none; overflow: visible; padding: 4px 0; }
            #bookmarksPage > div, #searchPage > div { padding: 16px !important; }
            .profile-header { padding: 20px 16px 14px; }
        }

        @media (max-width: 360px) {
            .home-feed-shell { padding-right: 12px; padding-left: 12px; }
            .home-world-copy { inset: auto 13px 13px; }
            .sidebar-left { padding-right: 4px; padding-left: 4px; }
            .sidebar-left .nav-item span { font-size: 10px !important; }
            .node-text { font-size: min(var(--reading-font-size, 16px), 16px); }
        }

        @media (prefers-reduced-motion: reduce) {
            .particle, .exp-dot.current { animation: none !important; }
            .world-stage, .node-content, .ambience-layer, .world-ambient-art, .cover-layer, .world-progress > span { transition-duration: 0.01ms !important; }
        }

        /* Section titles */
        .section-title {
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: rgba(255,255,255,0.35);
            margin-bottom: 0.5rem;
            padding: 0 1.5rem;
        }

        /* Bookmark tag */
        .bookmark-tag {

            border-radius: 9999px;
            font-size: 0.65rem;
            background: rgba(255,255,255,0.08);
            color: rgba(255,255,255,0.6);
            margin-top: 0.5rem;
        }
    </style>

    <!-- Toast -->
    <div id="toast" class="toast"></div>

    <script>

        // ============================================================
        // 世界数据
        // ============================================================
        const worlds = window.InformationRainContentRegistry?.worlds || [];
        if (!worlds.length) throw new Error('内容池未加载');

        // ============================================================
        // 状态管理
        // ============================================================
        let currentWorldIndex = 0;
        let currentNodeId = null;
        let pathHistory = [];
        let currentPage = 'worlds';
        let nodeTransitionTimer = null;
        let nodeTextSettleTimer = null;
        let nodeTextSettleHandler = null;
        let toastTimer = null;
        let experienceActor = null;
        let fallbackExperienceState = 'worlds.cover';
        let worldSwiper = null;
        let pendingWorldGesture = null;
        const worldImagePreloads = new Map();
        const storyRequests = new Map();
        const HOME_BATCH_SIZE = 8;
        const HOME_CARD_ASPECT = 9 / 16;
        let homeQuery = '';
        let homeTag = '全部';
        let homeResults = [];
        let homeLoadedCount = 0;
        let homeColumns = [];
        let homeColumnHeights = [];
        let homeObserver = null;
        let homeSearchTimer = null;

        const fallbackTransitions = {
            ENTER: 'worlds.reading.typing',
            TYPE_START: 'worlds.reading.typing',
            TYPE_DONE: 'worlds.reading.ready',
            MOVE: 'worlds.reading.transitioning',
            NODE_READY: 'worlds.reading.typing',
            ENDING: 'worlds.reading.ending',
            RESTART: 'worlds.reading.typing',
            EXIT: 'worlds.cover',
            SHOW_COVER: 'worlds.cover',
            OPEN_WORLDS: 'worlds.cover',
            OPEN_BOOKMARKS: 'bookmarks',
            OPEN_PROFILE: 'profile',
            OPEN_SEARCH: 'search',
            OPEN_HOME: 'home'
        };

        function syncExperienceState(snapshotValue = fallbackExperienceState) {
            const serialized = typeof snapshotValue === 'string' ? snapshotValue : JSON.stringify(snapshotValue);
            document.body.dataset.experienceState = serialized;
            if (serialized.includes('home')) currentPage = 'home';
            else if (serialized.includes('bookmarks')) currentPage = 'bookmarks';
            else if (serialized.includes('profile')) currentPage = 'profile';
            else if (serialized.includes('search')) currentPage = 'search';
            else currentPage = 'worlds';
        }

        function initExperienceMachine() {
            if (!window.XState?.createMachine || !window.XState?.createActor) {
                syncExperienceState();
                return;
            }

            const machine = window.XState.createMachine({
                id: 'experience',
                initial: 'worlds',
                states: {
                    worlds: {
                        initial: 'cover',
                        states: {
                            cover: { on: { ENTER: 'reading.typing' } },
                            reading: {
                                initial: 'typing',
                                states: {
                                    typing: { on: { TYPE_DONE: 'ready', MOVE: 'transitioning', ENDING: 'ending' } },
                                    ready: { on: { TYPE_START: 'typing', MOVE: 'transitioning', ENDING: 'ending' } },
                                    transitioning: { on: { NODE_READY: 'typing', ENDING: 'ending' } },
                                    ending: { on: { RESTART: 'typing' } }
                                },
                                on: { EXIT: '#experience.worlds.cover' }
                            }
                        },
                        on: {
                            SHOW_COVER: '.cover',
                            OPEN_HOME: '#experience.home',
                            OPEN_BOOKMARKS: '#experience.bookmarks',
                            OPEN_PROFILE: '#experience.profile',
                            OPEN_SEARCH: '#experience.search'
                        }
                    },
                    home: { on: { OPEN_WORLDS: '#experience.worlds', OPEN_BOOKMARKS: '#experience.bookmarks', OPEN_PROFILE: '#experience.profile', OPEN_SEARCH: '#experience.search' } },
                    bookmarks: { on: { OPEN_WORLDS: '#experience.worlds', OPEN_HOME: '#experience.home', OPEN_PROFILE: '#experience.profile', OPEN_SEARCH: '#experience.search' } },
                    profile: { on: { OPEN_WORLDS: '#experience.worlds', OPEN_HOME: '#experience.home', OPEN_BOOKMARKS: '#experience.bookmarks', OPEN_SEARCH: '#experience.search' } },
                    search: { on: { OPEN_WORLDS: '#experience.worlds', OPEN_HOME: '#experience.home', OPEN_BOOKMARKS: '#experience.bookmarks', OPEN_PROFILE: '#experience.profile' } }
                }
            });

            experienceActor = window.XState.createActor(machine);
            experienceActor.subscribe(snapshot => syncExperienceState(snapshot.value));
            experienceActor.start();
        }

        function sendExperience(type) {
            if (experienceActor) {
                experienceActor.send({ type });
                return;
            }
            if (fallbackTransitions[type]) fallbackExperienceState = fallbackTransitions[type];
            syncExperienceState();
        }

        function experienceMatches(value) {
            if (experienceActor) return experienceActor.getSnapshot().matches(value);
            return fallbackExperienceState === value || fallbackExperienceState.startsWith(value + '.');
        }

        function resolveTextTouchScroll(scrollTop, deltaY, maxScrollTop) {
            if (deltaY < 0 && scrollTop < maxScrollTop - 1) {
                return { handled: true, scrollTop: Math.min(maxScrollTop, scrollTop - deltaY) };
            }
            if (deltaY > 0 && scrollTop > 1) {
                return { handled: true, scrollTop: Math.max(0, scrollTop - deltaY) };
            }
            return { handled: false, scrollTop };
        }

        // localStorage keys
        const LS_KEYS = {
            bookmarks: 'ir_bookmarks',
            footprints: 'ir_footprints',
            endings: 'ir_endings',
            settings: 'ir_settings',
            stats: 'ir_stats'
        };

        // Default settings
        let settings = { textSize: 'md' }; // sm/md/lg

        // Stats
        let stats = {
            exploredWorlds: [],
            collectedEndings: [],
            totalSteps: 0
        };

        // DOM 引用
        const el = {
            stage: document.getElementById('worldStage'),
            worldSwiper: document.getElementById('worldSwiper'),
            worldSlides: document.getElementById('worldSlides'),
            ambience: document.getElementById('ambienceLayer'),
            worldBackdropA: document.getElementById('worldBackdropA'),
            worldBackdropB: document.getElementById('worldBackdropB'),
            nodeLayer: document.getElementById('nodeLayer'),
            nodeText: document.getElementById('nodeText'),
            dirControls: document.getElementById('dirControls'),
            coverLayer: document.getElementById('coverLayer'),
            coverTitle: document.getElementById('coverTitle'),
            coverAuthor: document.getElementById('coverAuthor'),
            coverDesc: document.getElementById('coverDesc'),
            coverDuration: document.getElementById('coverDuration'),
            worldTags: document.getElementById('worldTags'),
            btnEnter: document.getElementById('btnEnter'),
            endingLayer: document.getElementById('endingLayer'),
            endingTitle: document.getElementById('endingTitle'),
            endingSummary: document.getElementById('endingSummary'),
            btnExit: document.getElementById('btnExit'),
            btnSave: document.getElementById('btnSave'),
            btnLike: document.getElementById('btnLike'),
            worldDots: document.getElementById('worldDots'),

            // Right sidebar
            rightAuthor: document.getElementById('rightAuthor'),
            authorAvatar: document.getElementById('authorAvatar'),
            likeCount: document.getElementById('likeCount'),
            commentCount: document.getElementById('commentCount'),
            searchInput: document.getElementById('searchInput'),
            searchResults: document.getElementById('searchResults'),
            expMap: document.getElementById('expMap'),
            expSummary: document.getElementById('expSummary'),
            pathProgress: document.getElementById('pathProgress'),
            metaNodes: document.getElementById('metaNodes'),
            metaTime: document.getElementById('metaTime'),
            metaEnds: document.getElementById('metaEnds'),
            metaTags: document.getElementById('metaTags'),
            rightDesc: document.getElementById('rightDesc'),

            // Pages
            worldsPage: document.getElementById('worldsPage'),
            homePage: document.getElementById('homePage'),
            homeGrid: document.getElementById('homeGrid'),
            homeFilterRow: document.getElementById('homeFilterRow'),
            homeSearch: document.getElementById('homeSearch'),
            homeFeedStatus: document.getElementById('homeFeedStatus'),
            homeSentinel: document.getElementById('homeSentinel'),
            bookmarksPage: document.getElementById('bookmarksPage'),
            profilePage: document.getElementById('profilePage'),
            searchPage: document.getElementById('searchPage'),
            bookmarkGrid: document.getElementById('bookmarkGrid'),
            bookmarkEmpty: document.getElementById('bookmarkEmpty'),
            bookmarkCount: document.getElementById('bookmarkCount'),

            // Profile
            statWorlds: document.getElementById('statWorlds'),
            statEndings: document.getElementById('statEndings'),
            statBookmarks: document.getElementById('statBookmarks'),
            footprintList: document.getElementById('footprintList'),

            toast: document.getElementById('toast')
        };

        // ============================================================
        // 初始化
        // ============================================================
        function init() {
            initExperienceMachine();
            loadSettings();
            applySettings();
            loadStats();
            renderWorldDots();
            initWorldSwiper();
            loadWorld(0);
            setupEvents();
            setupNav();
            setupHomeFeed();
            renderBookmarks();
            updateProfileStats();
        }

        function renderWorldSlides() {
            el.worldSlides.replaceChildren();
            worlds.forEach((world, index) => {
                const slide = document.createElement('div');
                slide.className = 'swiper-slide';
                slide.dataset.worldIndex = String(index);
                slide.setAttribute('aria-label', `${world.title}，第 ${index + 1} 个内容，共 ${worlds.length} 个`);

                const image = document.createElement('div');
                image.className = 'world-slide-image';
                if (world.image) image.dataset.imageSource = world.image;
                slide.appendChild(image);
                el.worldSlides.appendChild(slide);
            });
        }

        function preloadWorldImage(index) {
            const world = worlds[index];
            if (!world?.image) return Promise.resolve();

            const cached = worldImagePreloads.get(index);
            if (cached?.source === world.image) return cached.promise;

            const image = new Image();
            image.decoding = 'async';
            image.src = world.thumbnail || world.image;
            const promise = typeof image.decode === 'function'
                ? image.decode().catch(() => undefined)
                : new Promise(resolve => {
                    image.addEventListener('load', resolve, { once: true });
                    image.addEventListener('error', resolve, { once: true });
                });
            worldImagePreloads.set(index, { source: world.image, image, promise });

            // 只保留当前作品及相邻作品的解码引用，避免手机长期占用全部封面内存。
            for (const [preloadedIndex] of worldImagePreloads) {
                if (Math.abs(preloadedIndex - index) > 1) worldImagePreloads.delete(preloadedIndex);
            }
            return promise;
        }

        function prepareWorldImageWindow(index) {
            const slides = el.worldSlides.children;
            for (let slideIndex = 0; slideIndex < slides.length; slideIndex++) {
                const image = slides[slideIndex].querySelector('.world-slide-image');
                const shouldLoad = Math.abs(slideIndex - index) <= 1;
                if (!image) continue;
                if (shouldLoad && image.dataset.imageSource) {
                    image.style.backgroundImage = `url("${image.dataset.imageSource}")`;
                    preloadWorldImage(slideIndex);
                } else {
                    image.style.removeProperty('background-image');
                }
            }
        }

        function initWorldSwiper() {
            renderWorldSlides();
            if (!window.Swiper) return;

            worldSwiper = new window.Swiper(el.worldSwiper, {
                direction: 'vertical',
                speed: 380,
                preventInteractionOnTransition: true,
                slidesPerView: 1,
                threshold: 12,
                resistance: true,
                resistanceRatio: 0.65,
                shortSwipes: true,
                longSwipes: true,
                longSwipesRatio: 0.2,
                grabCursor: true,
                watchSlidesProgress: true,
                mousewheel: {
                    forceToAxis: true,
                    sensitivity: 0.65,
                    releaseOnEdges: true,
                    thresholdDelta: 18,
                    thresholdTime: 420
                },
                a11y: {
                    enabled: true,
                    prevSlideMessage: '上一个内容',
                    nextSlideMessage: '下一个内容'
                },
                noSwiping: true,
                noSwipingSelector: 'button, .node-text, input, textarea, [data-swiper-no-swiping]',
                on: {
                    sliderFirstMove() {
                        el.stage.classList.add('is-swiping');
                    },
                    slideChange(swiper) {
                        if (swiper.activeIndex === currentWorldIndex) return;
                        currentWorldIndex = swiper.activeIndex;
                        loadWorld(currentWorldIndex);
                    },
                    transitionEnd() {
                        el.stage.classList.remove('is-swiping');
                    },
                    touchEnd(swiper) {
                        if (!swiper.animating) el.stage.classList.remove('is-swiping');
                    }
                }
            });
            prepareWorldImageWindow(currentWorldIndex);
            el.stage.classList.add('swiper-ready');
        }

        function loadSettings() {
            try {
                const s = localStorage.getItem(LS_KEYS.settings);
                if (s) {
                    const saved = JSON.parse(s);
                    settings.textSize = ['sm', 'md', 'lg'].includes(saved.textSize) ? saved.textSize : 'md';
                }
            } catch (e) {}
        }

        function applySettings() {
            const labels = { sm: '小', md: '中', lg: '大' };
            el.stage.dataset.textSize = settings.textSize;
            document.getElementById('textSizeLabel').textContent = labels[settings.textSize];
        }

        function saveSettings() {
            localStorage.setItem(LS_KEYS.settings, JSON.stringify(settings));
        }

        function loadStats() {
            try {
                const s = localStorage.getItem(LS_KEYS.stats);
                if (s) stats = JSON.parse(s);
            } catch (e) {}
        }

        function saveStats() {
            localStorage.setItem(LS_KEYS.stats, JSON.stringify(stats));
        }

        function getBookmarks() {
            try {
                const b = localStorage.getItem(LS_KEYS.bookmarks);
                const value = b ? JSON.parse(b) : [];
                return Array.isArray(value) ? value : [];
            } catch (e) { return []; }
        }

        function setBookmarks(bookmarks) {
            localStorage.setItem(LS_KEYS.bookmarks, JSON.stringify(bookmarks));
        }

        function addBookmark(worldId) {
            const bookmarks = getBookmarks();
            if (!bookmarks.includes(worldId)) {
                bookmarks.push(worldId);
                setBookmarks(bookmarks);
                return true;
            }
            return false;
        }

        function removeBookmark(worldId) {
            let bookmarks = getBookmarks();
            bookmarks = bookmarks.filter(id => id !== worldId);
            setBookmarks(bookmarks);
        }

        function isBookmarked(worldId) {
            return getBookmarks().includes(worldId);
        }

        function addFootprint(worldId, endingTitle) {
            try {
                let fp = JSON.parse(localStorage.getItem(LS_KEYS.footprints) || '[]');
                fp.unshift({ worldId, endingTitle, time: Date.now() });
                if (fp.length > 20) fp = fp.slice(0, 20);
                localStorage.setItem(LS_KEYS.footprints, JSON.stringify(fp));
            } catch (e) {}
        }

        function getFootprints() {
            try {
                return JSON.parse(localStorage.getItem(LS_KEYS.footprints) || '[]');
            } catch (e) { return []; }
        }

        function collectEnding(worldId, endingId) {
            try {
                let ce = JSON.parse(localStorage.getItem(LS_KEYS.endings) || '[]');
                const key = worldId + '::' + endingId;
                if (!ce.includes(key)) {
                    ce.push(key);
                    localStorage.setItem(LS_KEYS.endings, JSON.stringify(ce));
                }
            } catch (e) {}
        }

        function getCollectedEndings() {
            try {
                return JSON.parse(localStorage.getItem(LS_KEYS.endings) || '[]');
            } catch (e) { return []; }
        }

        function renderWorldDots() {
            el.worldDots.innerHTML = '<span id="worldPosition"></span><span class="world-progress"><span id="worldProgressFill"></span></span>';
            updateWorldDots();
        }

        function updateWorldDots() {
            const position = `${String(currentWorldIndex + 1).padStart(2, '0')} / ${worlds.length}`;
            document.getElementById('worldPosition').textContent = position;
            document.getElementById('worldProgressFill').style.width = `${((currentWorldIndex + 1) / worlds.length) * 100}%`;
            el.worldDots.setAttribute('aria-label', `第 ${currentWorldIndex + 1} 个内容，共 ${worlds.length} 个`);
        }

        // ============================================================
        // 页面切换
        // ============================================================
        function switchPage(pageName) {
            const pageEvents = {
                worlds: currentPage === 'worlds' ? 'SHOW_COVER' : 'OPEN_WORLDS',
                home: 'OPEN_HOME',
                bookmarks: 'OPEN_BOOKMARKS',
                profile: 'OPEN_PROFILE',
                search: 'OPEN_SEARCH'
            };
            sendExperience(pageEvents[pageName]);
            document.body.classList.toggle('worlds-active', pageName === 'worlds');
            document.body.classList.toggle('home-active', pageName === 'home');

            // Hide all pages
            el.worldsPage.classList.add('hidden');
            el.homePage.classList.add('hidden');
            el.bookmarksPage.classList.add('hidden');
            el.profilePage.classList.add('hidden');
            el.searchPage.classList.add('hidden');

            // Show target page
            if (pageName === 'worlds') el.worldsPage.classList.remove('hidden');
            else if (pageName === 'home') el.homePage.classList.remove('hidden');
            else if (pageName === 'bookmarks') {
                el.bookmarksPage.classList.remove('hidden');
                renderBookmarks();
            }
            else if (pageName === 'profile') {
                el.profilePage.classList.remove('hidden');
                updateProfileStats();
            }
            else if (pageName === 'search') {
                el.searchPage.classList.remove('hidden');
                renderSearchResults(el.searchInput.value);
            }

            // Update nav active state
            document.querySelectorAll('.nav-item').forEach(item => {
                const isCurrent = item.dataset.page === pageName;
                item.classList.toggle('active', isCurrent);
                if (isCurrent) item.setAttribute('aria-current', 'page');
                else item.removeAttribute('aria-current');
            });
        }

        function setupNav() {
            document.querySelectorAll('.nav-item').forEach(item => {
                item.addEventListener('click', () => {
                    const page = item.dataset.page;
                    if (page) switchPage(page);
                });
            });
        }

        // ============================================================
        // Home feed: local filtering + batched rendering, following PeerTube's list flow.
        // This prototype pages through the existing in-memory work registry; there is no API yet.
        // ============================================================
        function setupHomeFeed() {
            renderHomeFilters();
            resetHomeFeed();

            el.homeSearch.addEventListener('input', () => {
                clearTimeout(homeSearchTimer);
                homeSearchTimer = setTimeout(() => {
                    homeQuery = el.homeSearch.value.trim().toLocaleLowerCase();
                    resetHomeFeed();
                }, 180);
            });

            el.homeFilterRow.addEventListener('click', (event) => {
                const button = event.target.closest('[data-home-tag]');
                if (!button) return;
                homeTag = button.dataset.homeTag;
                el.homeFilterRow.querySelectorAll('.home-filter-button').forEach(filter => {
                    filter.classList.toggle('active', filter === button);
                    filter.setAttribute('aria-pressed', filter === button ? 'true' : 'false');
                });
                resetHomeFeed();
            });

            if ('IntersectionObserver' in window) {
                homeObserver = new IntersectionObserver(entries => {
                    if (entries.some(entry => entry.isIntersecting)) appendHomeBatch();
                }, { root: el.homePage, rootMargin: '640px 0px', threshold: 0 });
                homeObserver.observe(el.homeSentinel);
            } else {
                el.homePage.addEventListener('scroll', () => {
                    const nearBottom = el.homePage.scrollTop + el.homePage.clientHeight >= el.homePage.scrollHeight - 640;
                    if (nearBottom) appendHomeBatch();
                }, { passive: true });
            }

            window.addEventListener('resize', scheduleHomeRelayout, { passive: true });
        }

        function renderHomeFilters() {
            const frequencies = new Map();
            worlds.forEach(world => (world.tags || []).forEach(tag => {
                const cleanTag = String(tag).trim();
                if (cleanTag) frequencies.set(cleanTag, (frequencies.get(cleanTag) || 0) + 1);
            }));
            const tags = ['全部', ...Array.from(frequencies.entries())
                .sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0], 'zh-CN'))
                .slice(0, 8).map(([tag]) => tag)];

            el.homeFilterRow.replaceChildren();
            tags.forEach(tag => {
                const button = document.createElement('button');
                button.type = 'button';
                button.className = `home-filter-button${tag === homeTag ? ' active' : ''}`;
                button.dataset.homeTag = tag;
                button.textContent = tag;
                button.setAttribute('aria-pressed', tag === homeTag ? 'true' : 'false');
                el.homeFilterRow.appendChild(button);
            });
        }

        function getHomeColumnCount() {
            if (window.innerWidth <= 768) return 1;
            if (window.innerWidth <= 1100) return 2;
            return 3;
        }

        function getHomeGridMetrics() {
            const columnCount = getHomeColumnCount();
            const shellPadding = window.innerWidth <= 1100 ? 48 : Math.min(96, window.innerWidth * 0.052);
            const availableWidth = el.homeGrid.clientWidth || Math.max(300, window.innerWidth - 84 - shellPadding);
            const gap = 16;
            return { columnCount, columnWidth: (availableWidth - gap * (columnCount - 1)) / columnCount, gap };
        }

        function getHomeAspect(world, index) {
            // Keep every cover in the original vertical phone format (9:16).
            return HOME_CARD_ASPECT;
        }

        function resetHomeFeed() {
            homeResults = worlds.filter(world => {
                const matchesTag = homeTag === '全部' || (world.tags || []).some(tag => String(tag).trim() === homeTag);
                if (!matchesTag) return false;
                if (!homeQuery) return true;
                return [world.title, world.author, world.desc, ...(world.tags || [])]
                    .some(value => String(value).toLocaleLowerCase().includes(homeQuery));
            });

            homeLoadedCount = 0;
            homeColumnHeights = [];
            const { columnCount } = getHomeGridMetrics();
            el.homeGrid.replaceChildren();
            homeColumns = Array.from({ length: columnCount }, () => {
                const column = document.createElement('div');
                column.className = 'home-masonry-column';
                return column;
            });
            el.homeGrid.replaceChildren(...homeColumns);
            el.homeFeedStatus.textContent = '';
            if (currentPage === 'home') el.homePage.scrollTop = 0;
            if (!homeResults.length) {
                const empty = document.createElement('p');
                empty.className = 'home-feed-empty';
                empty.textContent = homeQuery || homeTag !== '全部' ? '没有找到匹配的作品' : '暂时没有可浏览的作品';
                el.homeGrid.appendChild(empty);
                updateHomeFeedStatus();
                return;
            }
            appendHomeBatch();
        }

        function appendHomeBatch() {
            if (!homeColumns.length || homeLoadedCount >= homeResults.length) {
                updateHomeFeedStatus();
                return;
            }
            const { columnWidth, gap } = getHomeGridMetrics();
            const batchEnd = Math.min(homeLoadedCount + HOME_BATCH_SIZE, homeResults.length);

            while (homeLoadedCount < batchEnd) {
                const world = homeResults[homeLoadedCount];
                const aspect = getHomeAspect(world, homeLoadedCount);
                let targetColumn = 0;
                for (let i = 1; i < homeColumns.length; i++) {
                    if ((homeColumnHeights[i] || 0) < (homeColumnHeights[targetColumn] || 0)) targetColumn = i;
                }
                const card = createHomeCard(world, aspect, homeLoadedCount);
                homeColumns[targetColumn].appendChild(card);
                homeColumnHeights[targetColumn] = (homeColumnHeights[targetColumn] || 0) + columnWidth / aspect + gap;
                homeLoadedCount++;
            }
            updateHomeFeedStatus();
        }

        function createHomeCard(world, aspect, index) {
            const card = document.createElement('button');
            card.type = 'button';
            card.className = 'home-world-card';
            card.style.aspectRatio = String(aspect);
            card.setAttribute('aria-label', `打开《${world.title}》，${world.author}`);

            const image = document.createElement('img');
            image.src = world.image;
            image.alt = '';
            image.loading = index < 3 ? 'eager' : 'lazy';
            image.decoding = 'async';
            card.appendChild(image);

            const copy = document.createElement('span');
            copy.className = 'home-world-copy';
            const title = document.createElement('span');
            title.className = 'home-world-title';
            title.textContent = world.title;
            copy.appendChild(title);

            const meta = document.createElement('span');
            meta.className = 'home-world-meta';
            const author = document.createElement('span');
            author.textContent = world.author;
            const duration = document.createElement('span');
            duration.textContent = world.duration;
            meta.append(author, duration);
            copy.appendChild(meta);

            const description = document.createElement('span');
            description.className = 'home-world-desc';
            description.textContent = world.desc;
            copy.appendChild(description);
            card.appendChild(copy);

            card.addEventListener('click', () => jumpToWorld(world.id));
            return card;
        }

        function updateHomeFeedStatus() {
            if (!homeResults.length) {
                el.homeFeedStatus.textContent = '0 个作品';
                return;
            }
            el.homeFeedStatus.textContent = homeLoadedCount >= homeResults.length
                ? `已显示全部 ${homeResults.length} 个作品`
                : `已显示 ${homeLoadedCount} / ${homeResults.length} 个作品`;
        }

        let homeRelayoutTimer = null;
        function scheduleHomeRelayout() {
            clearTimeout(homeRelayoutTimer);
            homeRelayoutTimer = setTimeout(() => {
                if (homeColumns.length === getHomeColumnCount()) return;
                const previousLoadedCount = homeLoadedCount;
                const previousScrollTop = el.homePage.scrollTop;
                homeLoadedCount = 0;
                homeColumnHeights = [];
                homeColumns = [];
                el.homeGrid.replaceChildren();
                const { columnCount } = getHomeGridMetrics();
                homeColumns = Array.from({ length: columnCount }, () => {
                    const column = document.createElement('div');
                    column.className = 'home-masonry-column';
                    return column;
                });
                el.homeGrid.replaceChildren(...homeColumns);
                if (!homeResults.length) {
                    const empty = document.createElement('p');
                    empty.className = 'home-feed-empty';
                    empty.textContent = homeQuery || homeTag !== '全部' ? '没有找到匹配的作品' : '暂时没有可浏览的作品';
                    el.homeGrid.appendChild(empty);
                    el.homePage.scrollTop = previousScrollTop;
                    return;
                }
                while (homeLoadedCount < previousLoadedCount) appendHomeBatch();
                el.homePage.scrollTop = previousScrollTop;
            }, 160);
        }

        // ============================================================
        // 收藏页面
        // ============================================================
        function renderBookmarks() {
            const bookmarks = getBookmarks();
            const bookmarkedWorlds = worlds.filter(w => bookmarks.includes(w.id));

            el.bookmarkCount.textContent = bookmarkedWorlds.length + ' 个内容';

            if (bookmarkedWorlds.length === 0) {
                el.bookmarkGrid.innerHTML = '';
                el.bookmarkEmpty.classList.remove('hidden');
                return;
            }

            el.bookmarkEmpty.classList.add('hidden');
            el.bookmarkGrid.innerHTML = bookmarkedWorlds.map(world => `
                <button type="button" class="bookmark-card" onclick="jumpToWorld('${world.id}')">
                    <div class="w-full h-24 rounded-lg mb-3 bg-cover bg-center" style="background-image: url('${world.thumbnail || world.image}')"></div>
                    <h3 class="text-sm font-medium text-white/90 mb-1">${world.title}</h3>
                    <p class="text-xs text-white/40">${world.author}</p>
                    <div class="bookmark-tag">
                        <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                        ${world.duration}
                    </div>
                    <div class="flex flex-wrap gap-1 mt-2">
