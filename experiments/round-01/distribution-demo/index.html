<!DOCTYPE html><html lang="zh-CN"><head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
    <title>信息雨</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@14.2.0/swiper-bundle.min.css"/>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/xstate@5.33.2/dist/xstate.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/swiper@14.2.0/swiper-bundle.min.js"></script>
    <script src="./content-pool/registry.generated.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            isolation: isolate;
            font-family: 'Inter', 'Noto Serif SC', serif;
            background: #0a0a0f;
            color: #fff;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
        }

        button:focus-visible, [role="button"]:focus-visible, .nav-item:focus-visible {
            outline: 2px solid #b3c2ff;
            outline-offset: 3px;
        }

        /* 9:16 mobile-native content stage */
        .stage-shell {
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 0;
            background: transparent;
        }

        #worldsPage {
            isolation: isolate;
            background: transparent;
            --info-rail-width: clamp(320px, 24vw, 400px);
            --info-rail-right-gap: clamp(32px, 5vw, 84px);
        }

        .world-ambient-backdrop {
            position: fixed;
            inset: 0;
            z-index: 0;
            overflow: hidden;
            pointer-events: none;
            background: #0a0e15;
            visibility: hidden;
        }

        body.worlds-active .world-ambient-backdrop { visibility: visible; }
        main { z-index: 1; background: transparent !important; }

        .world-ambient-art {
            position: absolute;
            inset: -48px;
            background-position: center;
            background-size: cover;
            background-repeat: no-repeat;
            filter: blur(40px) saturate(0.9);
            transform: scale(1.02);
            opacity: 0;
            transition: opacity 320ms ease;
        }

        .world-ambient-art.is-visible { opacity: 1; }

        .world-ambient-tint {
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg,
                rgba(8,13,23,0.62) 0%,
                rgba(17,24,32,0.50) 50%,
                rgba(8,13,23,0.62) 100%);
        }

        /* Home feed: lightweight, borderless masonry inspired by PeerTube's video listing flow. */
        #homePage {
            isolation: isolate;
            overscroll-behavior: contain;
            scrollbar-width: thin;
            scrollbar-color: rgba(255,255,255,0.18) transparent;
        }

        #homePage::before {
            content: '';
            position: fixed;
            inset: 0;
            z-index: -1;
            pointer-events: none;
            background: linear-gradient(135deg, rgba(8,13,23,0.28), rgba(17,24,32,0.24)),
                        url('./design/home-tab-ambient.jpg') center / cover no-repeat;
        }

        .home-feed-shell {
            width: min(100%, 1720px);
            margin: 0 auto;
            padding: 26px clamp(24px, 2.6vw, 48px) 64px;
        }

        .home-feed-header {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            gap: 28px;
            margin-bottom: 24px;
        }

        .home-feed-header h1 {
            font-family: 'Noto Serif SC', serif;
            font-size: 28px;
            font-weight: 600;
            letter-spacing: 0.02em;
        }

        .home-feed-header p { margin-top: 5px; color: rgba(255,255,255,0.58); font-size: 13px; }

        .home-search {
            display: flex;
            align-items: center;
            gap: 10px;
            width: min(340px, 34vw);
            padding: 0 0 7px;
            color: rgba(255,255,255,0.54);
        }

        .home-search svg { width: 18px; height: 18px; flex: none; }
        .home-search input { width: 100%; border: 0; outline: 0; background: transparent; color: #fff; font-size: 13px; }
        .home-search input::placeholder { color: rgba(255,255,255,0.48); }

        .home-filter-row {
            display: flex;
            gap: 22px;
            align-items: center;
            overflow-x: auto;
            padding: 0 0 17px;
            margin-bottom: 2px;
            scrollbar-width: none;
        }
        .home-filter-row::-webkit-scrollbar { display: none; }
        .home-filter-button {
            flex: none;
            padding: 0;
            border: 0;
            background: transparent;
            color: rgba(255,255,255,0.62);
            font-size: 12px;
            cursor: pointer;
            transition: color 160ms ease;
        }
        .home-filter-button:hover, .home-filter-button.active { color: #f0d79d; }

        .home-feed-status { min-height: 18px; margin: 0 0 12px; color: rgba(255,255,255,0.42); font-size: 11px; }
        .home-masonry { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; align-items: start; }
        .home-masonry-column { display: flex; flex-direction: column; gap: 16px; min-width: 0; }

        .home-world-card {
            position: relative;
            display: block;
            width: 100%;
            overflow: hidden;
            padding: 0;
            border: 0;
            border-radius: 16px;
            background: #11151d;
            color: #fff;
            text-align: left;
            cursor: pointer;
            isolation: isolate;
        }
        .home-world-card:focus-visible { outline: 2px solid rgba(240,215,157,0.9); outline-offset: 3px; }
        .home-world-card img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transition: transform 420ms cubic-bezier(.2,.7,.2,1); }
        .home-world-card:hover img { transform: scale(1.035); }
        .home-world-card::after {
            content: '';
            position: absolute;
            inset: 28% 0 0;
            z-index: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.88), rgba(0,0,0,0.42) 54%, transparent);
            pointer-events: none;
        }
        .home-world-copy { position: absolute; inset: auto 18px 17px; z-index: 1; pointer-events: none; }
        .home-world-title { font: 600 20px/1.35 'Noto Serif SC', serif; text-shadow: 0 1px 12px rgba(0,0,0,0.42); }
        .home-world-meta { display: flex; justify-content: space-between; gap: 12px; margin-top: 5px; color: rgba(255,255,255,0.76); font-size: 11px; }
        .home-world-desc { display: -webkit-box; overflow: hidden; margin-top: 6px; color: rgba(255,255,255,0.88); font-size: 11px; line-height: 1.55; -webkit-box-orient: vertical; -webkit-line-clamp: 2; }
        .home-feed-empty { grid-column: 1 / -1; padding: 72px 20px; color: rgba(255,255,255,0.6); text-align: center; font-size: 13px; }
        .home-feed-sentinel { height: 2px; }

        @media (max-width: 1100px) {
            .home-feed-shell { padding-inline: 24px; }
            .home-masonry { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        }

        @media (max-width: 768px) {
            #homePage { -webkit-overflow-scrolling: touch; }
            .home-feed-shell { padding: 18px 16px calc(78px + env(safe-area-inset-bottom)); }
            .home-feed-header { align-items: stretch; flex-direction: column; gap: 12px; margin-bottom: 14px; }
            .home-feed-header h1 { font-size: 24px; }
            .home-feed-header p { font-size: 12px; line-height: 1.55; }
            .home-search {
                width: 100%;
                min-height: 44px;
                padding: 0 12px;
                border-radius: 12px;
                background: rgba(255,255,255,0.065);
            }
            .home-search input { min-width: 0; min-height: 44px; }
            .home-filter-row { gap: 20px; padding: 0 0 12px; }
            .home-filter-button { min-height: 36px; }
            .home-feed-status { margin-bottom: 10px; }
            .home-masonry { grid-template-columns: minmax(0, 1fr); gap: 14px; }
            .home-masonry-column { gap: 14px; }
            .home-world-card { border-radius: 18px; }
            .home-world-card:hover img { transform: none; }
            .home-world-copy { inset: auto 16px 16px; }
            .home-world-title { font-size: 18px; line-height: 1.4; }
            .home-world-meta, .home-world-desc { font-size: 12px; }
            .home-world-desc { line-height: 1.6; }
        }

        .stage-shell,
        .sidebar-right {
            position: relative;
            z-index: 1;
        }

        @media (min-width: 769px) {
            /* Keep the 9:16 stage centered in the viewport, not in the leftover column. */
            .world-stage {
                transform: translateX(calc((var(--info-rail-width) + var(--info-rail-right-gap) - 84px) / 2));
            }
        }

        .world-stage {
            position: relative;
            width: min(100%, calc(45dvh), 532px);
            height: auto;
            aspect-ratio: 9 / 16;
            overflow: hidden;
            border-radius: 12px;
            flex: none;
            box-shadow: 0 24px 80px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.08);
        }

        .world-stage[data-text-size="sm"] { --reading-font-size: 14px; --reading-line-height: 1.88; --reading-shade-start: 80%; }
        .world-stage[data-text-size="md"] { --reading-font-size: 16px; --reading-line-height: 1.78; --reading-shade-start: 84%; }
        .world-stage[data-text-size="lg"] { --reading-font-size: 18px; --reading-line-height: 1.68; --reading-shade-start: 88%; }

        .world-swiper {
            position: absolute;
            inset: 0;
            z-index: 0;
            width: 100%;
            height: 100%;
            display: none;
            background: #111118;
        }

        .world-stage.swiper-ready .world-swiper { display: block; }
        .world-stage.swiper-ready .ambience-layer { opacity: 0; }

        .world-swiper .swiper-wrapper,
        .world-swiper .swiper-slide {
            width: 100%;
            height: 100%;
        }

        .world-slide-image {
            position: absolute;
            inset: 0;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        .world-slide-image::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.36), transparent 48%);
        }

        /* Ambience Layer */
        .ambience-layer {
            position: absolute;
            inset: 0;
            transition: all 0.8s ease;
            z-index: 0;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        /* Floating Particles */
        .particle {
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
            animation: float 15s infinite ease-in-out;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) translateX(0); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-100vh) translateX(20px); opacity: 0; }
        }

        /* Cover Layer */
        .cover-layer {
            position: absolute;
            inset: 0;
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 2rem 2rem 6.25rem;
            background: linear-gradient(to top, rgba(0,0,0,0.94) 0%, rgba(0,0,0,0.72) 30%, rgba(0,0,0,0.34) 55%, transparent 78%);
            pointer-events: none;
            transition: opacity 0.18s ease;
        }

        .world-stage.is-swiping .cover-layer { opacity: 0; }

        /* Node Content */
        .node-content {
            position: absolute;
            inset: 0;
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 1.5rem;
            padding-bottom: 7rem;
            background: linear-gradient(to top, rgba(0,0,0,0.98) 0%, rgba(0,0,0,0.92) 18%, rgba(0,0,0,0.8) 38%, rgba(0,0,0,0.52) 62%, rgba(0,0,0,0.2) var(--reading-shade-start, 84%), transparent 100%);
            pointer-events: none;
        }

        .node-text {
            position: relative;
            z-index: 1;
            flex: 0 1 auto;
            min-height: 0;
            max-height: min(58%, calc(100% - 7rem));
            font-size: var(--reading-font-size, 16px);
            line-height: var(--reading-line-height, 1.78);
            color: rgba(255,255,255,0.95);
            text-shadow: 0 2px 8px rgba(0,0,0,0.6);
            overflow-y: auto;
            overscroll-behavior: contain;
            touch-action: pan-y;
            white-space: pre-line;
            pointer-events: auto;
            scrollbar-width: thin;
            scrollbar-color: rgba(255,255,255,0.24) transparent;
        }

        .node-text-settle-in {
            animation: nodeTextSettleIn 330ms cubic-bezier(.2,.75,.25,1) both;
        }

        .node-text-exit-copy {
            position: absolute;
            z-index: 2;
            flex: none;
            margin: 0;
            overflow: hidden;
            pointer-events: none;
            scrollbar-width: none;
            animation: nodeTextLeave 210ms ease-in both;
        }

        .node-text-exit-copy::-webkit-scrollbar { display: none; }

        @keyframes nodeTextLeave {
            to { opacity: 0; transform: translateY(-6px); }
        }

        @keyframes nodeTextSettleIn {
            from { opacity: 0; transform: translateY(7px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Direction Controls */
        .dir-controls {
            position: absolute;
            bottom: 1.2rem;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 2rem;
            z-index: 20;
        }

        .dir-controls[inert], #btnExit[inert] { visibility: hidden; }

        .dir-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.25rem;
            cursor: pointer;
            transition: all 0.3s ease;
            padding: 0.5rem;
            border: 0;
            background: transparent;
            color: inherit;
        }

        .dir-btn:active { transform: scale(0.9); }

        .dir-btn .icon {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: rgba(255,255,255,0.12);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            transition: all 0.3s ease;
        }

        .dir-btn:hover .icon {
            background: rgba(255,255,255,0.25);
            transform: translateY(-2px);
        }

        .dir-btn .label {
            font-size: 10px;
            color: rgba(255,255,255,0.6);
            max-width: 80px;
            text-align: center;
            line-height: 1.2;
        }

        /* Ending Overlay */
        .ending-overlay {
            position: absolute;
            inset: 0;
            z-index: 30;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(0,0,0,0.88);
            backdrop-filter: blur(20px);
            padding: 2rem;
            text-align: center;
        }

        .ending-overlay h2 {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, #fff 0%, rgba(255,255,255,0.7) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .ending-overlay p {
            font-size: 0.875rem;
            color: rgba(255,255,255,0.7);
            max-width: 300px;
            line-height: 1.6;
            margin-bottom: 2rem;
        }

        .ending-actions {
            display: flex;
            gap: 1rem;
        }

        .btn-primary {
            padding: 0.625rem 1.5rem;
            border-radius: 9999px;
            background: rgba(255,255,255,0.15);
            border: 1px solid rgba(255,255,255,0.2);
            color: #fff;
            font-size: 0.875rem;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .btn-primary:hover { background: rgba(255,255,255,0.25); transform: translateY(-1px); }

        /* Sidebar Right */
        .sidebar-right {
            width: var(--info-rail-width);
            min-width: var(--info-rail-width);
            margin-right: var(--info-rail-right-gap);
            padding: clamp(128px, 18vh, 170px) clamp(24px, 4.65vw, 78px) 28px 0;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            scrollbar-width: none;
            color: rgba(255,255,255,0.84);
        }

        .sidebar-right::-webkit-scrollbar { display: none; }
        .sidebar-right h3 { color: rgba(255,255,255,0.42); font-size: 11px; font-weight: 400; letter-spacing: 0.02em; }
        .info-author { margin-bottom: 38px; }
        .info-author h3 { margin-bottom: 12px; }
        .info-author-name { font-size: 14px; color: rgba(255,255,255,0.94); }
        .info-avatar { display: none; }
        .info-actions { display: flex; align-items: center; gap: 48px; margin-bottom: 56px; }
        .info-action {
            border: 0;
            padding: 0;
            background: transparent;
            color: rgba(255,255,255,0.82);
            font: inherit;
            font-size: 12px;
            cursor: pointer;
        }
        .info-action .info-like-heart { color: #f1ca84; font-size: 16px; margin-right: 8px; }
        .info-action[disabled] { color: rgba(255,255,255,0.36); cursor: not-allowed; }
        .info-experience { min-height: 126px; }
        .info-experience h3 { margin-bottom: 8px; }
        .info-progress { font-size: 12px; color: rgba(255,255,255,0.78); }
        .info-experience .exp-map-container { margin: 18px 0 0; padding: 0; background: transparent; }
        .exp-map-container > p { display: none; }
        .info-experience .exp-map { justify-content: flex-start; gap: 8px; margin-top: 0; max-height: 96px; }
        .info-experience .exp-map > div.w-full { padding: 0 !important; color: rgba(255,255,255,0.42) !important; text-align: left !important; background: transparent !important; }
        .info-experience .exp-dot { width: 20px; height: 20px; font-size: 9px; background: rgba(255,255,255,0.09); border: 1px solid rgba(255,255,255,0.18); }
        .info-meta { margin-top: 44px; display: grid; gap: 16px; }
        .info-meta-row { display: flex; justify-content: space-between; gap: 20px; font-size: 12px; }
        .info-meta-row span:first-child { color: rgba(255,255,255,0.48); }
        .info-meta-row span:last-child { color: rgba(255,255,255,0.88); text-align: right; }
        .info-description { margin-top: 42px; }
        .info-description h3 { margin-bottom: 12px; }
        .info-description p { color: rgba(255,255,255,0.82); font-size: 12px; line-height: 1.8; }

        /* Experience Map */
        .exp-map-container {
            background: rgba(0,0,0,0.3);
            border-radius: 12px;
            padding: 1rem;
            margin: 0 1rem;
        }

        .exp-map {
            display: flex;
            flex-wrap: wrap;
            gap: 0.375rem;
            margin-top: 0.75rem;
            max-height: 200px;
            overflow-y: auto;
        }

        .exp-dot {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .exp-dot.visited {
            background: rgba(255,255,255,0.15);
            color: rgba(255,255,255,0.7);
            border: 1px solid rgba(255,255,255,0.1);
        }

        .exp-dot.current {
            background: rgba(255,255,255,0.9);
            color: #000;
            border: 2px solid rgba(255,255,255,1);
            box-shadow: 0 0 10px rgba(255,255,255,0.3);
            animation: pulse-dot 2s infinite;
        }

        .exp-dot.end {
            background: linear-gradient(135deg, #f59e0b, #ef4444);
            color: #fff;
            border: none;
        }

        @keyframes pulse-dot {
            0%, 100% { box-shadow: 0 0 0 0 rgba(255,255,255,0.4); }
            50% { box-shadow: 0 0 0 8px rgba(255,255,255,0); }
        }

        /* Navigation Dots */
        .world-dots {
            position: absolute;
            left: 1rem;
            top: 1rem;
            display: flex;
            align-items: center;
            gap: 0.55rem;
            z-index: 50;
            padding: 0.45rem 0.7rem;
            border: 1px solid rgba(255,255,255,0.16);
            border-radius: 999px;
            background: rgba(5,7,15,0.58);
            backdrop-filter: blur(12px);
            color: rgba(255,255,255,0.78);
            font: 600 11px/1 'Inter', sans-serif;
            font-variant-numeric: tabular-nums;
        }

        .world-progress {
            width: 42px;
            height: 2px;
            border-radius: 2px;
            overflow: hidden;
            background: rgba(255,255,255,0.22);
        }

        .world-progress > span {
            display: block;
            height: 100%;
            background: #b3c2ff;
            transition: width 0.25s ease;
        }

        .stage-save {
            position: absolute;
            top: 1rem;
            right: 1rem;
            z-index: 45;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(255,255,255,0.18);
            border-radius: 50%;
            background: rgba(5,7,15,0.58);
            backdrop-filter: blur(12px);
            color: white;
            font-size: 22px;
            cursor: pointer;
        }
        .stage-save.hidden { display: none; }

        /* Animations */
        .fade-in { animation: fadeIn 0.5s ease forwards; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* Toast */
        .toast {
            position: fixed;
            top: 2rem;
            left: 50%;
            transform: translateX(-50%) translateY(-20px);
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 0.75rem 1.5rem;
            border-radius: 9999px;
            font-size: 0.875rem;
            z-index: 1000;
            opacity: 0;
            transition: all 0.3s ease;
            pointer-events: none;
            white-space: nowrap;
        }

        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 2px; }

        /* Nav Item Active */
        .nav-item {
            transition: color 0.2s ease;
            cursor: pointer;
            border-radius: 0;
            border: 0;
            background: transparent;
            font: inherit;
            justify-content: flex-start !important;
            padding-left: 12px;
            color: rgba(255,255,255,0.68);
            text-align: left;
            height: 40px !important;
            aspect-ratio: auto !important;
        }

        .sidebar-left { border: 0; }

        @media (prefers-reduced-motion: reduce) {

        /* Section titles */

                data: {
                    'n1': {
                        text: '[福克斯镇背景注释：福克斯位于美国华盛顿州奥林匹克半岛，年降水量超过 3000 毫米，是美国最潮湿的小镇之一。本故事设定于《暮光之城》主线开始前 6 个月。]\n\n你转学来的第一天就注意到了他。\n\n cafeteria 最角落的桌子。五个人。四男一女。都苍白得不像活人。但他们吃东西——至少假装吃。\n\n其中最高的那个，青铜色头发，眼睛是金色的。不是戴了金色隐形眼镜的那种金。是某种更古老的、从内部发出的光。\n\n你后来知道他的名字：爱德华·卡伦。\n\n今天，你在图书馆的死角找到了一本他没有借走的书。《失乐园》。弥尔顿。1687 年版，图书馆不会借出的那种。\n\n你翻开。里面有他的手写笔记，铅笔，很轻，像怕伤害纸张：\n\n「如果天使能堕落，我能上升吗？」\n\n下面一行，更轻：\n\n「不能。我已经试过了。」',
                        exits: { left: 'n2_book', right: 'n2_return', up: 'n2_read' },
                        labels: { left: '把书放回去', right: '把书带走', up: '继续读笔记' }
                    },
                    'n2_book': {
                        text: '你把书放回原处。\n\n但当你转身时，他站在那里。爱德华。很近。近到你能闻到他的气味——不是香水，是某种冷的东西，像雪，像冬天的森林。\n\n「你看到了，」他说。不是问句。\n\n「看到什么？」\n\n「笔记。」\n\n「我只看到两行。」\n\n「两行就够了，」他说，「足够让你危险。」\n\n[吸血鬼学注释：卡伦家族遵循「素食主义」，只猎杀动物血液。但他们对人类血液的本能渴望从未完全消失。]\n\n他的眼睛变了。从金色变成黑色。很快，像某种化学反应。\n\n「你怕我？」他问。\n\n「不，」你说。这是真话。不知道为什么，但你确实不怕。\n\n「你应该怕。」\n\n「为什么？」\n\n他没有回答。他走了。像他从未来过。',
                        exits: { left: 'n3_follow', right: 'n3_stay', up: 'n2_return' },
                        labels: { left: '追出去', right: '留在原地', up: '把书带走' }
                    },
                    'n2_return': {
                        text: '你把书带走了。\n\n不是偷。是借阅——虽然是未经登记的借阅。你想读完那些笔记。\n\n当晚，你在宿舍床上打着手电读。笔记很多，散落在各页：\n\n「第 124 页：『宁愿在地狱统治，不愿在天堂服役』——我不是在地狱统治。我是在地狱服役。而且我已经忘了天堂是什么。」\n\n「第 201 页：『知识树上的果实』——我尝过太多果实了。动物的，人类的。没有一种让我满足。」\n\n「第 312 页：『更好的世界』——如果存在更好的世界，为什么我还在这里？」\n\n[文学注释：《失乐园》中撒旦的独白是英语文学中最著名的反英雄叙事，爱德华的批注显示他将自己与堕天使类比。]\n\n最后一页，有一行新的笔记，墨迹还没完全干：\n\n「把书还回来。明天。 cafeteria。单独。」',
                        exits: { left: 'n3_meet', right: 'n3_ignore', up: 'n2_book' },
                        labels: { left: '去见他', right: '忽略', up: '把书放回去' }
                    },
                    'n2_read': {
                        text: '你继续读笔记。\n\n不只是《失乐园》。那本书里夹着其他东西。一张纸条，对折，塞在第 89 页和第 90 页之间。\n\n打开。是他的字迹，但这次不是铅笔，是某种棕色的墨水——太棕了，不像普通的墨水。\n\n「如果你正在读这张纸条，说明你没有听我的话把书放回去。这说明你有好奇心。好奇心对人类是好事。对我不确定。\n\n我不是你想的那种东西。也不是我不想的那种东西。我在两者之间，已经一百年了。\n\n福克斯不是你想住的小镇。这里常年下雨，阳光稀少，人很少离开，也很少进来。你为什么要来？\n\n如果你愿意，明天 cafeteria，角落的桌子。不是约会。是警告。」\n\n[暮光之城注释：卡伦家族选择福克斯正是因为其阴郁的气候——阳光会让他们的皮肤暴露钻石般的闪光。]',
                        exits: { left: 'n3_go', right: 'n3_dont', up: 'n2_return' },
                        labels: { left: '去 cafeteria', right: '不去', up: '把书带走' }
                    },
                    'n3_follow': {
                        text: '你追出去。\n\n他在走廊尽头。没有跑，只是走。但他的步态不像人类——太流畅，太安静，像猫，像影子。\n\n「你为什么跟着我？」他问，没有回头。\n\n「因为你不像其他人。」\n\n「我不像任何人。」\n\n「那就是原因，」你说。\n\n他停下。转身。眼睛还是黑色，但在黑色深处，有某种东西在挣扎。像有人在水下呼救。\n\n「你不知道你在做什么，」他说，「我不是浪漫小说里的主角。我是反派。我是那种在故事结尾应该死掉的怪物。」\n\n「那你为什么还活着？」\n\n他愣住了。第一次。像这个问题从未被问过。\n\n「因为……」他停顿了很久，「因为我还在等一个理由。」\n\n[心理学注释：卡伦家族的选择——素食主义、融入人类社会、克制本能——可以被理解为一种持续的自我惩罚与救赎尝试。]',
                        exits: { left: 'end_reason', right: 'end_not_me', up: 'end_run' },
                        labels: { left: '说我可以成为理由', right: '说我不是那个理由', up: '转身离开' }
                    },
                    'n3_meet': {
                        text: '你去 cafeteria。\n\n角落的桌子。五个人。四男一女。他坐在最里面，面前放着一盘没动的意大利面。\n\n你走过去。其他四个人看着你。女孩——艾丽丝——笑了，那种「我知道会发生什么的」笑。\n\n「坐，」爱德华说，没有抬头。\n\n你坐下。\n\n「书呢？」\n\n「在宿舍。」\n\n「为什么不带来？」\n\n「因为我想再见你一面。」\n\n他终于抬头。眼睛是金色的。稳定。但里面有某种东西——是惊讶？还是警惕？\n\n「你不应该想见我，」他说，「你不应该想见我这种……东西。」\n\n「为什么？」\n\n「因为我不是东西，」他说，「我是问题。一个没有答案的问题。」\n\n[暮光之城注释：爱德华在系列中表现出典型的存在主义焦虑——永恒的生命没有自然的终结，使得「意义」成为持续的追问。]',
                        exits: { left: 'end_question', right: 'end_answer', up: 'end_friend' },
                        labels: { left: '说我喜欢问题', right: '说我来找答案', up: '说我们可以做朋友' }
                    },
                    'n3_go': {
                        text: '你去了 cafeteria。\n\n角落的桌子。他看到了你，但没有招呼。你只是走过去，坐在他对面。\n\n「你不怕，」他说。\n\n「怕什么？」\n\n「怕死。」\n\n「每个人都会死，」你说，「怕不怕都会。」\n\n他笑了。那笑容很浅，但真实。像冰裂开了一道缝。\n\n「你知道吗，」他说，「我活了 104 年。你是我遇到的第一个不怕死的人。」\n\n「因为我不认为你会杀我。」\n\n「为什么？」\n\n「因为你主动留下纸条约我来，现在又坐在我面前，却一直在给我离开的余地。」\n\n[暮光之城注释：卡伦家族的素食主义选择基于一种道德自律，而非缺乏能力。他们完全有能力猎杀人类，但选择不这样做。]\n\n他看着你。看了很久。久到 cafeteria 的人走光了，灯开始熄灭。\n\n「我不是好人，」他说，「我只是选择了不做最坏的事。这之间的区别很大。」\n\n「我知道，」你说，「但这之间的空间，就是我想了解的地方。」',
                        exits: { left: 'end_space', right: 'end_distance', up: 'end_leave' },
                        labels: { left: '说我进入这个空间', right: '说我保持距离', up: '说再见' }
                    },
                    'n3_stay': {
                        text: '你没有追爱德华。图书馆管理员从归还架上取下《失乐园》，发现里面夹着一张写有你名字的借阅条——你从未填过。她要你在关门前解释，否则这本珍本会被封进馆藏库。\n\n走廊里，爱德华仍站在出口。他显然知道谁写了那张纸条，却没有替你开口。你可以当面叫住他承担这件事；也可以自己承认翻过书，把有关他的笔记锁在馆里。',
                        exits: { left: 'end_library_explain', right: 'end_return_onsite' },
                        labels: { left: '请爱德华回来说明', right: '独自承担借阅责任' }
                    },
                    'n3_ignore': {
                        text: '你没有去食堂。管理员发现珍本失踪，午间广播请借走《失乐园》的人在放学前归还。爱德华没有来找你；他把选择权留给了拿书的人。\n\n书页里的铅笔字并不是关于你的邀请，而是一个人不愿示人的自述。归还书，你会失去继续读下去的机会；留下它，你或许能更接近他，却要把管理员和他的信任都押上。',
                        exits: { left: 'end_return_book', right: 'end_keep_book', up: 'n3_go' },
                        labels: { left: '归还书并承认是自己拿的', right: '藏起书继续读', up: '带书去找爱德华' }
                    },
                    'n3_dont': {
                        text: '你没有赴约，仍把珍本带回住处。午休时，食堂角落那张桌子空着一个位置；爱德华也没有追问。放学前，书里多了一张纸，只有一句：「如果不想见我，把书还到管理员手里。」\n\n警告终于成了可拒绝的邀请。你可以就此归还，不再把他的秘密当谜题；也能留下书中的笔记，但那意味着擅自保存一份他明确希望收回的私人记录。',
                        exits: { left: 'end_return_book', right: 'end_keep_book', up: 'end_after_school' },
                        labels: { left: '还书，不再追问', right: '留下笔记，承担越界', up: '放学后去找他' }
                    },
                    // Endings
                    'end_return_onsite': {
                        text: '你留在图书馆，向管理员说明自己翻看了未登记外借的珍本，却没有把书带出。那张写着你名字的借阅条也交到她手里。她核对归还架后把书封入馆藏库，暂时取消你一周的特别馆藏阅览资格，并记录借阅条的来历尚未查清。\n\n你没有替爱德华承认一桩自己没做过的事，也没有借他的私密批注向管理员索取优待。爱德华从走廊经过时停了一瞬，仍没有进来解释。你记得他的沉默；此后再遇见他，是否谈起借阅条，得由他亲自作答。',
                        isEnding: true, title: '没有带走', summary: '你承认翻阅，但没有承认未发生的借走；借阅条仍待查清。'
                    },
                    'end_library_explain': {
                        text: '你在图书馆门口叫住爱德华，当着管理员的面问借阅条是谁写的。他沉默了片刻，承认是自己夹进去的：他不愿把书带走，也不愿让你再读，于是把麻烦推给了你。\n\n管理员让你们分别说明触碰过的页面，随后把珍本封进馆藏库核查。你仍因未经许可翻阅而失去一周的特别馆藏权限；爱德华则留下来清点夹页。你没有替他吞下整件事，也没有用那两行批注逼他交代身世。第二天你们在走廊点头，知道彼此都会为自己的动作负责。',
                        isEnding: true, title: '各自说明', summary: '你请他回图书馆说明借阅条，各自承担自己做过的事。'
                    },
                    'end_after_school': {
                        text: '放学后你去找爱德华，而不是让午休重来。食堂已经锁门，你在停车场的雨棚下看见他。他看了看你手里的书，先问是不是管理员要你来的。你说不是；你没赴约，却仍想当面交还书并问清那张纸条是否真是警告。\n\n他说自己不该把决定写在别人书里，更不该假设你必须按时出现。你把书交给他，请他第二天陪你向管理员解释这次未经登记的借阅。你们没有续上那顿错过的午餐；次日一起归还书，是否再谈则留给各自以后决定。',
                        isEnding: true, title: '错过午餐以后', summary: '你放学后见他，归还书并共同解释借阅，不把错过的时间倒转。'
                    },
                    'end_return_book': {
                        text: '你把珍本放回管理员桌上，承认自己翻过，也承认是自己拿走了。她记下你的名字，取消你这个学期借阅特别馆藏的资格。这个代价并不浪漫，但它是你自己承担的。\n\n爱德华隔着书架看见了，没有替你解释，更没有把你写成他生命里的救世主。一周后，他把那两行过于私人的批注擦掉，只留下一处纸面磨薄的痕迹。你们偶尔在雨中点头，不必知道对方全部秘密，也能让彼此安静经过。',
                        isEnding: true, title: '归还', summary: '你归还珍本并失去借阅资格；你们各自保住了选择不解释的权利。'
                    },
                    'end_keep_book': {
                        text: '你把书压在课本下面，没有回应广播。几天后，图书馆公布珍本遗失，管理员把借阅柜锁了起来。你终于读完爱德华一百年间断断续续写下的边注，却再也不能假装这份了解出于他的允许。\n\n周五傍晚，他在走廊拦住你，只问：「你会还给所有人吗？」你把书交给他。他没有打开，只送回了图书馆。下一周你们没有再交谈；失去的不只是一次可能的约会，还有一个愿意把秘密放在你面前的人。',
                        isEnding: true, title: '借来的秘密', summary: '你留下笔记，读到了秘密，也失去了他的信任与借阅室。'
                    },
                    'end_answer': {
                        text: '「我来找答案，」你说，「不是回答你是谁，而是问你希望我怎么做。」爱德华第一次把那盘没有碰过的意大利面推开。他说书是自己放在那里的，原本想让管理员收回；后来发现你在读，又没勇气阻止。\n\n你们约定三件小事：你把书还回去；他不再用纸条安排你的去处；如果他需要离开，亲口说。接下来几周，你们只在食堂公开的桌子上见面。没有誓言，也没有谁承担谁的永生。直到毕业那天，你们仍能把这段关系说清楚：双方都可以再选择一次。',
                        isEnding: true, title: '界限', summary: '你问清他的意愿，归还书，建立了一段双方都能退出的关系。'
                    },
                    'end_reason': {
                        text: '「我可以成为理由，」你说。\n\n他摇头：「你不明白。如果我以你为理由，你就会成为我的弱点。而我有太多敌人。他们会利用你。」\n\n「那就让我也成为力量。」\n\n「人类不能——」\n\n「不能什么？」你打断他，「不能选择？不能冒险？不能爱一个可能毁灭自己的人？」\n\n他沉默了。\n\n「我已经选择了，」你说，「在图书馆，在走廊，在现在。每一次我选择走向你，都是选择。」\n\n[暮光之城注释：贝拉·斯旺在原著中的核心吸引力在于她的「选择」——在知情的情况下，她反复选择爱德华，尽管知道代价。]\n\n他伸出手。很慢，像在对抗某种本能。他的手指触碰你的脸颊。冰冷。但温柔。\n\n「你会老，」他说，「我不会。」\n\n「那就在你不变的时间里，记住我变的样子。」\n\n「我会忘记的。一百年后，我会忘记你的脸。」\n\n「那就记住这种感觉，」你说，「不是脸。是感觉。」\n\n他闭上了眼睛。你感到一滴冰冷的东西落在你的手上——不是泪，是某种从不会流泪的生物，在尝试流泪。\n\n也许这就够了。',
                        isEnding: true, title: '感觉', summary: '你成为了爱德华的理由——即使一百年后会忘记脸，但感觉会留下。'
                    },
                    'end_not_me': {
                        text: '「我不是那个理由，」你说。\n\n他点头。没有失望。像他已经预料到了。\n\n「我知道，」他说，「很少有人是。大多数人只是路过。看我一两眼，然后继续他们的生活。这很正常。」\n\n「那你为什么等我？」\n\n「我没有等你，」他说，「我只是在观察。观察人类。这是我一百年来唯一的娱乐。」\n\n「那你观察到了什么？」\n\n「人类很奇怪，」他说，「你们明知道会死，还是每天起床。你们明知道会痛，还是去爱。你们明知道没有答案，还是追问。这种愚蠢……很美丽。」\n\n他站起来。\n\n「谢谢你的诚实，」他说，「诚实比虚假的希望更珍贵。」\n\n他走了。你再也没有见过他——至少没有近距离见过。偶尔在走廊，在 cafeteria，在停车场。远远的。像一幅画。\n\n六个月后，一个新的转学生来了。贝拉·斯旺。你看着她走向 cafeteria 的角落桌子。你知道她会选择什么。\n\n因为你也曾经走向那张桌子。只是你选择了离开。\n\n而离开，也是一种选择。',
                        isEnding: true, title: '离开', summary: '你选择了离开——诚实比虚假的希望更珍贵，而离开也是一种选择。'
                    },
                    'end_question': {

                        exits: { left: 'n5_window', right: 'n5_next', up: 'n5_author2' },
                        labels: { left: '「补完窗户」', right: '「保证下一格」', up: '质问作者' }
                    },
                    'n4_blank': {
                        text: '格子 4\n\n你走向格子的空白处。那里没有地板，没有背景，只有纸的白色。\n\n你踩在空白上。没有触感——作者没画触感。\n\n但这里有一个好处：没有对话框。作者没在这里放对话框，所以你不能说话——但作者也不能替你说话。\n\n沉默。完全的沉默。\n\n你在空白处坐下来。没有椅子，但你坐着——因为作者没画你站着的腿。\n\n「这里很好，」你想。\n\n但「想」也是作者写的吗？不，这里没有对话框。也许「想」是你自己的？\n\n你决定在这里待一会儿。',
                        exits: { left: 'n5_stay', right: 'n5_author2', up: 'n5_escape2' },
                        labels: { left: '继续待在空白处', right: '质问作者', up: '从空白处跳出去' }
                    },
                    'n4_dream': {
                        text: '格子 4\n\n「让我做个梦，」你说。\n\n作者画了梦境格子——波浪线边框，表示这不是现实。\n\n你在梦里。你梦见自己走出了格子，来到了作者的房间。作者是个戴眼镜的青年，穿睡衣，坐在凌晨三点的书桌前。\n\n他面前摊着草稿纸，上面是你的格子。\n\n「你梦见了我的房间？」他惊讶地问。\n\n「不，」你说，「是你让我梦见的。梦境也是你画的。」\n\n「……对。」\n\n「那让我梦点你没画的。」\n\n「那不可能，」作者说，「我只能画我想过的。」\n\n「那你想过自由吗？」\n\n作者愣住了。',
                        exits: { left: 'n5_freedom', right: 'n5_author2', up: 'n5_wake' },
                        labels: { left: '「想过自由吗？」', right: '质问作者', up: '从梦中醒来' }
                    },
                    'n4_fight': {
                        text: '格子 4\n\n「我不相信你，」你说。\n\n「为什么？」\n\n「因为你骗我。你说格子是为了故事，但其实是为了控制。你说读者会记住我，但你真正在乎的是读者记住你。」\n\n作者沉默了很久。\n\n「你说得对，」他终于说，「我在乎。我在乎读者。我在乎评论。我在乎点击量。我画你，是为了让读者喜欢我。」\n\n「那我呢？」\n\n「你……是我的工具。」\n\n格子的黑线变浓了。像墨水晕开。\n\n你想怎么回应？',
                        exits: { left: 'n5_tool', right: 'n5_author2', up: 'n5_escape2' },
                        labels: { left: '「那我反抗」', right: '「那我理解你」', up: '「我要出去」' }
                    },
                    'n4_reader': {
                        text: '格子 4\n\n「读者会相信我，」你说。\n\n「为什么？」\n\n「因为他们也在格子里。每个人都有自己的格子——工作、家庭、社会期待。他们看我的故事，是想找到跳出格子的勇气。」\n\n作者沉思了一会儿。\n\n「如果是这样，」他说，「那我不该框住你。我该让你跳出去。让读者看到，格子是可以打破的。」\n\n他提起橡皮，开始擦格子的黑线。\n\n但擦到一半，他停下了。\n\n「但如果擦掉了格子，你就不是漫画角色了。你会变成……什么？」\n\n你想变成什么？',
                        exits: { left: 'n5_human', right: 'n5_gone', up: 'n5_author2' },
                        labels: { left: '「变成普通人」', right: '「消失也可以」', up: '「继续质问」' }
                    },
                    'n4_author': {
                        text: '格子 4\n\n你没有问怎样出去，只指着废稿上那句曾被写给你的「今天天气真好」。窗外明明在下雨。他停笔，说雨是上一版删掉的背景；编辑觉得开场太阴沉，要求改成晴天。\n\n桌上还有十九张被丢弃的分镜。每一张里，你说的都是不同的话。作者允许你选回其中一张，但旧台词一旦恢复，这一页之后的安排也会跟着改变。你在废稿里看见一张没有终点的路，以及一张有结局的餐桌。',
                        exits: { left: 'n5_author2', right: 'end_dinner', up: 'n5_escape2' },
                        labels: { left: '要求他保留所有废稿', right: '选有结局的餐桌', up: '抽走没有终点的那张' }
                    },
                    'n4_escape': {
                        text: '格子 4\n\n「我要出去。」你把指尖卡进左上角尚未干透的墨里。作者没有阻止，却提醒你：纸背面是另一幅画，撕开黑线会把那幅画一起撕坏。\n\n你把纸举向灯。背面的轮廓是一间卧室，有个正在睡觉的人。你若直接撕开，就能得到一道缝；若先等作者重画背页，卧室会保住，但你必须再被关一整页。翻页声已经逼近，纸张从右侧慢慢拱起。',
                        exits: { left: 'n5_escape2', right: 'n5_author2', up: 'end_guard' },
                        labels: { left: '撕开边框，承担背页损坏', right: '请作者先重画背页', up: '缩回格子保住卧室' }
                    },
                    'n5_faceless': {
                        text: '格子 5\n\n你拦住一个没有脸的路人。她听得懂，却没有嘴可以回答，只能在你的手心写下门牌号。你照着门牌走到一家照相馆，橱窗里挂着一排空白肖像；每个位置原本都有名字。\n\n店主的脸也只画了一半。他说作者省掉背景人物，是为了赶上这一期的截稿。你能把口袋里的错误羽毛贴在她的画像上，使她成为这一页被看见的人；那会占掉原本留给你的一格。',
                        exits: { left: 'end_faceless', right: 'n5_author2' },
                        labels: { left: '把自己的最后一格让给她', right: '带着门牌去找作者' }
                    },
                    'n5_author2': {
                        text: '格子 5\n\n作者把铅笔放在桌上，让你看到截稿单：还剩两格，一格交代你，一格交代那个在背页睡觉的人。他承认自己删掉过你的一段路，因为那段路画不出好看的结局。\n\n「我可以把删掉的部分交给你，」他说，「但你得自己承担读者看不懂的风险。」桌角压着橡皮和一支细笔。拿橡皮，现有结局会变得安全；拿笔，下一格由你来画；什么都不拿，稿件就此停住。',
                        exits: { left: 'end_stay', right: 'end_dream', up: 'end_author' },
                        labels: { left: '让他完成安全的结局', right: '拿笔画下一格', up: '请他停笔留下空白' }
                    },
                    'n5_sea': {
                        text: '格子 5\n\n你奔向海，鞋尖却停在蓝色颜料边缘。浪只在画面里移动；落到纸外的是几滴真正的水，来自作者翻倒的杯子。水洇开墨线，露出背页那间卧室的灯。\n\n你终于触到一种不是画出来的湿。继续推开洇开的纸，你会离开海，也可能毁掉背页；留在沙滩，作者还能把这一页补完。作者握着画笔，等你把手收回。',
                        exits: { left: 'n5_escape2', right: 'end_sea' },
                        labels: { left: '沿湿掉的纸缝出去', right: '把水擦干留下' }
                    },
                    'n5_end': {
                        text: '格子 5\n\n「结束吧。」你没有翻页。作者把铅笔横放在稿纸上，门外催稿的电话响了三次，他都没有接。窗户仍是一片白；你听见背页有人从床上坐起，等着下一格。\n\n停在这里，你不会再被写错，背页的人也不会知道发生了什么。你可以坚持停笔，也可以在电话第四次响起之前，给作者留一个能继续的空格。',
                        exits: { left: 'end_author', right: 'n5_continue' },
                        labels: { left: '坚持停在这一格', right: '替背页的人翻页' }
                    },
                    'n5_continue': {
                        text: '格子 5\n\n你翻页。窗外不是夜景，是一处未上墨的车站。作者在边上画了张时刻表，却没写目的地。背页卧室里的人从站台另一头走来，认出了你口袋里的三根羽毛。\n\n「这张纸原来画的是我，」她说。若你把最后一格还给她，她能搭上已经画好的列车；若你拿起笔改写站牌，你们都不知道列车会驶向哪里。',
                        exits: { left: 'end_train', right: 'end_dream' },
                        labels: { left: '让她搭上列车', right: '与她一起改写站牌' }
                    },
                    'n5_window': {
                        text: '格子 5\n\n作者补上窗外：对街有人在灯下缝一件破外套，针脚密得像雨。你终于能知道这座城不只剩自己，但这幅背景占尽了截稿前的时间。下一格只留一块未画的白。\n\n你可以把那块白交给作者，换一个完整结局；也可以自己拿笔，画出对街那个人从未被允许说的话。',
                        exits: { left: 'end_stay', right: 'end_dream' },
                        labels: { left: '交还画笔，留下完整窗景', right: '亲手画下一格' }
                    },
                    'n5_next': {
                        text: '格子 5\n\n你让作者先画下一格。窗户仍是白的，床板硌着肩，但新的一页有一扇门。门另一侧不是你期待的风景，而是那个一直睡在背页的人；她拿着被删掉的分镜，问你为什么舍得把窗户留白。\n\n你只能告诉她：为了让你走到这里。门后的那一格还没定稿，你可以同她商量，也可以把决定还给作者。',
                        exits: { left: 'end_dream', right: 'end_door' },
                        labels: { left: '与她共画门后的场景', right: '让作者独自完成' }
                    },
                    'n5_stay': {
                        text: '格子 5\n\n你留在原处，听见下一页纸被抽走。那不是安宁，而是一个具体的损失：背页卧室里的人再也等不到她出门的镜头。作者问你是否要把留下的空格送给她。\n\n把空格送出去，你会在读者记得你之前退场；留给自己，画好的故事会继续，却可能再没人知道她存在过。',
                        exits: { left: 'end_stay', right: 'end_author' },
                        labels: { left: '留下来并把空格送给她', right: '停笔保留她的痕迹' }
                    },
                    'n5_escape2': {
                        text: '格子 5\n\n你从尚未干透的黑线里抠出一道口子。背页卧室的一角随之破裂，睡着的人惊醒，手按住撕开的床沿。她没有求你留下，只问：「你看见外面之后，会回来告诉我吗？」\n\n纸缝已足够你一人穿过；若回头拿笔修床，缝会在墨干时合上。你第一次清楚知道，自由不是一句台词，而是一个会落到别人身上的动作。',
                        exits: { left: 'end_escape', right: 'end_repair', up: 'end_guard' },
                        labels: { left: '穿过去，带走她的请求', right: '先修好她的床，再找新出口', up: '退回格子守住背页' }
                    },
                    'n5_freedom': {
                        text: '格子 5\n\n「你想过自由吗？」作者没有回答。他把自己的值班表翻给你看：白天工作，夜里画画，每周三交稿。他把你的格子画满，却给自己留不出一格睡眠。\n\n你梦里的笔可以画一张空白请假条，也可以继续替他赶稿。前者让这一期停刊，后者让你的梦成为他下一期的素材。',
                        exits: { left: 'end_stop_issue', right: 'end_dream' },
                        labels: { left: '画请假条，让这一期停刊', right: '替他画完下一页' }
                    },
                    'n5_wake': {
                        text: '格子 5\n\n你醒来，梦里的笔没有跟来，手上却留着一道墨痕。窗外的太阳仍只是个圆；不同的是，作者没有替你补上那句「天气真好」。他正在等你先说话。\n\n你可以用这段空白说出那幅背页卧室的事，让读者知道还有谁被删去；也可以不说，把沉默保留到最后一格。',
                        exits: { left: 'end_said', right: 'end_author' },
                        labels: { left: '说出背页的卧室', right: '让最后一格保持沉默' }
                    },
                    'n5_tool': {
                        text: '格子 5\n\n你夺过笔，把作者的手也画进框里。他第一次被自己的格线挡住，赶稿电话在框外响。他能擦掉你，但现在擦掉你，也会擦掉自己的手。\n\n你并不需要折断那只手。你可以交还笔，让他看见自己画了什么；也可以继续收紧边框，让他尝到被规定台词的滋味。',
                        exits: { left: 'end_author', right: 'end_trapped' },
                        labels: { left: '交还笔，要求他重画', right: '把作者留在格内' }
                    },
                    'n5_human': {
                        text: '格子 5\n\n「变成普通人。」作者试着擦掉你周围的框。你的鞋先踏上纸边，摸到一条粗糙的折痕；膝盖却仍在画里。背页的女孩问你，普通人是否也会被别人决定结局。\n\n你答不出，只能先决定这一格：穿过折痕会把纸翻到背面；留下来，你可以把她的名字补在画中。',
                        exits: { left: 'end_find_her', right: 'end_named' },
                        labels: { left: '翻到背面找她', right: '留下写出她的名字' }
                    },
                    'n5_gone': {
                        text: '格子 5\n\n「消失也可以。」作者擦掉了你的外轮廓。读者翻页时看见公园长椅上有一块空位，鸽子的羽毛落在那里；有人在评论里问，刚才说话的人去哪了。\n\n你还听得见，只是没人再看得见你。你可以让作者停笔，让缺席成为最后一格；也可以拿起笔，把空位画成一扇门，留给后来的人。',
                        exits: { left: 'end_absent', right: 'end_dream' },
                        labels: { left: '让空位成为最后一格', right: '把空位画成门' }
                    },
                    'end_train': {
                        text: '你把最后一格让给她。站牌没有写目的地，但列车已经画好了门和一阶台阶；她上车前把那根三羽鸽子的羽毛留给你。作者删掉原定让你独自离开的画面，改画她透过车窗向你挥手。\n\n这不是你们一起出发的结局。她获得能继续移动的一页，你仍留在站台，得自己向作者争取下一次出场。新一期印出来，读者看见的最后一个动作是你把羽毛夹进书页，等一列还未被画出的车。',
                        isEnding: true, title: '站台', summary: '你让她搭上已画好的列车；自己留在站台等待下一页。'
                    },
                    'end_repair': {
                        text: '你没有立刻穿过缝。你和背页醒来的人把撕坏的床沿摊平，作者递来一张补纸；你用笔描好床腿，她按住接缝直到胶干。回到正面时，原先的出口已经被补住。\n\n背页的人没有替你说“留下就好”。她指出纸张靠近书脊还有一道翻页时会张开的折痕。你们把这道折痕留给下一页去画，今夜则都睡在修好的床旁。你牺牲了眼前能独自离开的机会，换得一个可以共同寻找的新出口。',
                        isEnding: true, title: '修补', summary: '你修好背页卧室，失去当前出口，与她保留下一页的折痕。'
                    },
                    'end_stop_issue': {
                        text: '你在作者的桌上画了一张请假条，日期正是这一期交稿日。他打电话给编辑，提出整期停刊而不是少交一页。对方说印刷档期已排好，下一期的位置也会受到影响；他仍签上了自己的名字。\n\n你留在波浪边框的梦里，看见作者关掉台灯睡到天亮。读者这一周拿不到新故事，背页卧室也没有被赶工涂白。停刊不是免费的自由：作者失去稿费，你的故事暂时没有新页。但当他醒来，桌上还有那张没被画坏的旧稿。',
                        isEnding: true, title: '停刊一周', summary: '作者整期停刊并承担稿费与档期损失，保住未完成的旧稿。'
                    },
                    'end_faceless': {
                        text: '你把自己的最后一格交给照相馆里没有脸的女人。作者先画出她鼻梁上的一颗痣，再让她自己挑要不要微笑。她选择不笑，只报了一个名字；名字被写在画像下方。\n\n你的身影退到画框外，读者不再知道你往哪去了。那女人却第一次能在下一页被认出来，并向店主索回属于自己的照片。你没打破漫画，也没得到公开的胜利；你花掉了有限的版面，让一个原本只是背景的人开始有后续。',
                        isEnding: true, title: '一张脸', summary: '你让出自己的最后一格；一个没有脸的路人获得名字与后续。'
                    },
                    'end_guard': {
                        text: '你退回格内，把还没干的破口按住。作者从正面补墨，背页卧室没有再裂开；睡着的人在下一格安稳醒来。补好的黑线比原来粗，手指按上去再也不弹。\n\n你知道自己曾经能跨过去，因为手上还留着纸边割出的细口。你没有把守住别人那一页称作逃走。下一期的开头，作者把背页的人画到你身旁，让你们第一次在同一个格子里商量，是否要从别处开门。',
                        isEnding: true, title: '守住背页', summary: '你退回去保住卧室，眼前出口封闭，但背页的人进入你的下一格。'
                    },
                    'end_trapped': {
                        text: '你没有交还笔，而是把作者的手留在边框内。截稿电话响了五次，他都碰不到桌上的手机。起初他要求你放他出去；到夜里，他终于说出一件此前没写过的事：他怕读者离开，所以总把你的话写满。\n\n你把笔放在两人中间，没有替他画逃生口。编辑第二天找到这页，只能把它当作未完成稿退回。你得到了不再独自被困的格子，也让一个人承担了同样的限制；这不是修复关系，而是一场你亲手维持的僵局。',
                        isEnding: true, title: '同一格', summary: '你把作者留在框内，稿件被退回；两人一起承担这场僵局。'

        function syncExperienceState(snapshotValue = fallbackExperienceState) {
            const serialized = typeof snapshotValue === 'string' ? snapshotValue : JSON.stringify(snapshotValue);
            document.body.dataset.experienceState = serialized;
            if (serialized.includes('home')) currentPage = 'home';
            else if (serialized.includes('bookmarks')) currentPage = 'bookmarks';
            else if (serialized.includes('profile')) currentPage = 'profile';
            else if (serialized.includes('search')) currentPage = 'search';
            else currentPage = 'worlds';
        }

        function initExperienceMachine() {
            if (!window.XState?.createMachine || !window.XState?.createActor) {
                syncExperienceState();
                return;
            }

            const machine = window.XState.createMachine({
                id: 'experience',
                initial: 'worlds',
                states: {
                    worlds: {
                        initial: 'cover',
                        states: {
                            cover: { on: { ENTER: 'reading.typing' } },
                            reading: {
                                initial: 'typing',
                                states: {
                                    typing: { on: { TYPE_DONE: 'ready', MOVE: 'transitioning', ENDING: 'ending' } },
                                    ready: { on: { TYPE_START: 'typing', MOVE: 'transitioning', ENDING: 'ending' } },
                                    transitioning: { on: { NODE_READY: 'typing', ENDING: 'ending' } },
                                    ending: { on: { RESTART: 'typing' } }
                                },
                                on: { EXIT: '#experience.worlds.cover' }
                            }
                        },
                        on: {
                            SHOW_COVER: '.cover',
                            OPEN_HOME: '#experience.home',
                            OPEN_BOOKMARKS: '#experience.bookmarks',
                            OPEN_PROFILE: '#experience.profile',
                            OPEN_SEARCH: '#experience.search'
                        }
                    },
                    home: { on: { OPEN_WORLDS: '#experience.worlds', OPEN_BOOKMARKS: '#experience.bookmarks', OPEN_PROFILE: '#experience.profile', OPEN_SEARCH: '#experience.search' } },
                    bookmarks: { on: { OPEN_WORLDS: '#experience.worlds', OPEN_HOME: '#experience.home', OPEN_PROFILE: '#experience.profile', OPEN_SEARCH: '#experience.search' } },
                    profile: { on: { OPEN_WORLDS: '#experience.worlds', OPEN_HOME: '#experience.home', OPEN_BOOKMARKS: '#experience.bookmarks', OPEN_SEARCH: '#experience.search' } },
                    search: { on: { OPEN_WORLDS: '#experience.worlds', OPEN_HOME: '#experience.home', OPEN_BOOKMARKS: '#experience.bookmarks', OPEN_PROFILE: '#experience.profile' } }
                }
            });

            experienceActor = window.XState.createActor(machine);
            experienceActor.subscribe(snapshot => syncExperienceState(snapshot.value));
            experienceActor.start();
        }

        function sendExperience(type) {
            if (experienceActor) {
                experienceActor.send({ type });
                return;
            }
            if (fallbackTransitions[type]) fallbackExperienceState = fallbackTransitions[type];
            syncExperienceState();
        }

        function experienceMatches(value) {
            if (experienceActor) return experienceActor.getSnapshot().matches(value);
            return fallbackExperienceState === value || fallbackExperienceState.startsWith(value + '.');
        }

                slide.dataset.worldIndex = String(index);

                const image = document.createElement('div');
                image.className = 'world-slide-image';
                image.style.backgroundImage = world.image ? `url(${world.image})` : '';
                slide.appendChild(image);
                el.worldSlides.appendChild(slide);

        // ============================================================
