        // This prototype pages through the existing in-memory work registry; there is no API yet.
        // ============================================================
        function setupHomeFeed() {
            renderHomeFilters();
            resetHomeFeed();

            el.homeSearch.addEventListener('input', () => {
                clearTimeout(homeSearchTimer);
                homeSearchTimer = setTimeout(() => {
                    homeQuery = el.homeSearch.value.trim().toLocaleLowerCase();
                    resetHomeFeed();
                }, 180);
            });

            el.homeFilterRow.addEventListener('click', (event) => {
                const button = event.target.closest('[data-home-tag]');
                if (!button) return;
                homeTag = button.dataset.homeTag;
                el.homeFilterRow.querySelectorAll('.home-filter-button').forEach(filter => {
                    filter.classList.toggle('active', filter === button);
                    filter.setAttribute('aria-pressed', filter === button ? 'true' : 'false');
                });
                resetHomeFeed();
            });

            if ('IntersectionObserver' in window) {
                homeObserver = new IntersectionObserver(entries => {
                    if (entries.some(entry => entry.isIntersecting)) appendHomeBatch();
                }, { root: el.homePage, rootMargin: '640px 0px', threshold: 0 });
                homeObserver.observe(el.homeSentinel);
            } else {
                el.homePage.addEventListener('scroll', () => {
                    const nearBottom = el.homePage.scrollTop + el.homePage.clientHeight >= el.homePage.scrollHeight - 640;
                    if (nearBottom) appendHomeBatch();
                }, { passive: true });
            }

            window.addEventListener('resize', scheduleHomeRelayout, { passive: true });
        }

        function renderHomeFilters() {
            const frequencies = new Map();
            worlds.forEach(world => (world.tags || []).forEach(tag => {
                const cleanTag = String(tag).trim();
                if (cleanTag) frequencies.set(cleanTag, (frequencies.get(cleanTag) || 0) + 1);
            }));
            const tags = ['全部', ...Array.from(frequencies.entries())
                .sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0], 'zh-CN'))
                .slice(0, 8).map(([tag]) => tag)];

            el.homeFilterRow.replaceChildren();
            tags.forEach(tag => {
                const button = document.createElement('button');
                button.type = 'button';
                button.className = `home-filter-button${tag === homeTag ? ' active' : ''}`;
                button.dataset.homeTag = tag;
                button.textContent = tag;
                button.setAttribute('aria-pressed', tag === homeTag ? 'true' : 'false');
                el.homeFilterRow.appendChild(button);
            });
        }

        function getHomeColumnCount() {
            if (window.innerWidth <= 768) return 1;
            if (window.innerWidth <= 1100) return 2;
            return 3;
        }

        function getHomeGridMetrics() {
            const columnCount = getHomeColumnCount();
            const shellPadding = window.innerWidth <= 1100 ? 48 : Math.min(96, window.innerWidth * 0.052);
            const availableWidth = el.homeGrid.clientWidth || Math.max(300, window.innerWidth - 84 - shellPadding);
            const gap = 16;
            return { columnCount, columnWidth: (availableWidth - gap * (columnCount - 1)) / columnCount, gap };
        }

        function getHomeAspect(world, index) {
            // Keep every cover in the original vertical phone format (9:16).
            return HOME_CARD_ASPECT;
        }

        function resetHomeFeed() {
            homeResults = worlds.filter(world => {
                const matchesTag = homeTag === '全部' || (world.tags || []).some(tag => String(tag).trim() === homeTag);
                if (!matchesTag) return false;
                if (!homeQuery) return true;
                return [world.title, world.author, world.desc, ...(world.tags || [])]
                    .some(value => String(value).toLocaleLowerCase().includes(homeQuery));
            });

            homeLoadedCount = 0;
            homeColumnHeights = [];
            const { columnCount } = getHomeGridMetrics();
            el.homeGrid.replaceChildren();
            homeColumns = Array.from({ length: columnCount }, () => {
                const column = document.createElement('div');
                column.className = 'home-masonry-column';
                return column;
            });
            el.homeGrid.replaceChildren(...homeColumns);
            el.homeFeedStatus.textContent = '';
            if (currentPage === 'home') el.homePage.scrollTop = 0;
            if (!homeResults.length) {
                const empty = document.createElement('p');
                empty.className = 'home-feed-empty';
                empty.textContent = homeQuery || homeTag !== '全部' ? '没有找到匹配的作品' : '暂时没有可浏览的作品';
                el.homeGrid.appendChild(empty);
                updateHomeFeedStatus();
                return;
            }
            appendHomeBatch();
        }

        function appendHomeBatch() {
            if (!homeColumns.length || homeLoadedCount >= homeResults.length) {
                updateHomeFeedStatus();
                return;
            }
            const { columnWidth, gap } = getHomeGridMetrics();
            const batchEnd = Math.min(homeLoadedCount + HOME_BATCH_SIZE, homeResults.length);

            while (homeLoadedCount < batchEnd) {
                const world = homeResults[homeLoadedCount];
                const aspect = getHomeAspect(world, homeLoadedCount);
                let targetColumn = 0;
                for (let i = 1; i < homeColumns.length; i++) {
                    if ((homeColumnHeights[i] || 0) < (homeColumnHeights[targetColumn] || 0)) targetColumn = i;
                }
                const card = createHomeCard(world, aspect, homeLoadedCount);
                homeColumns[targetColumn].appendChild(card);
                homeColumnHeights[targetColumn] = (homeColumnHeights[targetColumn] || 0) + columnWidth / aspect + gap;
                homeLoadedCount++;
            }
            updateHomeFeedStatus();
        }

        function createHomeCard(world, aspect, index) {
            const card = document.createElement('button');
            card.type = 'button';
            card.className = 'home-world-card';
            card.style.aspectRatio = String(aspect);
            card.setAttribute('aria-label', `打开《${world.title}》，${world.author}`);

            const image = document.createElement('img');
            image.src = world.image;
            image.alt = '';
            image.loading = index < 3 ? 'eager' : 'lazy';
            image.decoding = 'async';
            card.appendChild(image);

            const copy = document.createElement('span');
            copy.className = 'home-world-copy';
            const title = document.createElement('span');
            title.className = 'home-world-title';
            title.textContent = world.title;
            copy.appendChild(title);

            const meta = document.createElement('span');
            meta.className = 'home-world-meta';
            const author = document.createElement('span');
            author.textContent = world.author;
            const duration = document.createElement('span');
            duration.textContent = world.duration;
            meta.append(author, duration);
            copy.appendChild(meta);

            const description = document.createElement('span');
            description.className = 'home-world-desc';
            description.textContent = world.desc;
            copy.appendChild(description);
            card.appendChild(copy);

            card.addEventListener('click', () => jumpToWorld(world.id));
            return card;
        }

        function updateHomeFeedStatus() {
            if (!homeResults.length) {
                el.homeFeedStatus.textContent = '0 个作品';
                return;
            }
            el.homeFeedStatus.textContent = homeLoadedCount >= homeResults.length
                ? `已显示全部 ${homeResults.length} 个作品`
                : `已显示 ${homeLoadedCount} / ${homeResults.length} 个作品`;
        }

        let homeRelayoutTimer = null;
        function scheduleHomeRelayout() {
            clearTimeout(homeRelayoutTimer);
            homeRelayoutTimer = setTimeout(() => {
                if (homeColumns.length === getHomeColumnCount()) return;
                const previousLoadedCount = homeLoadedCount;
                const previousScrollTop = el.homePage.scrollTop;
                homeLoadedCount = 0;
                homeColumnHeights = [];
                homeColumns = [];
                el.homeGrid.replaceChildren();
                const { columnCount } = getHomeGridMetrics();
                homeColumns = Array.from({ length: columnCount }, () => {
                    const column = document.createElement('div');
                    column.className = 'home-masonry-column';
                    return column;
                });
                el.homeGrid.replaceChildren(...homeColumns);
                if (!homeResults.length) {
                    const empty = document.createElement('p');
                    empty.className = 'home-feed-empty';
                    empty.textContent = homeQuery || homeTag !== '全部' ? '没有找到匹配的作品' : '暂时没有可浏览的作品';
                    el.homeGrid.appendChild(empty);
                    el.homePage.scrollTop = previousScrollTop;
                    return;
                }
                while (homeLoadedCount < previousLoadedCount) appendHomeBatch();
                el.homePage.scrollTop = previousScrollTop;
            }, 160);
        }

        // ============================================================
        // 收藏页面
        // ============================================================
        function renderBookmarks() {
            const bookmarks = getBookmarks();
            const bookmarkedWorlds = worlds.filter(w => bookmarks.includes(w.id));

            el.bookmarkCount.textContent = bookmarkedWorlds.length + ' 个内容';

            if (bookmarkedWorlds.length === 0) {
                el.bookmarkGrid.innerHTML = '';
                el.bookmarkEmpty.classList.remove('hidden');
                return;
            }

            el.bookmarkEmpty.classList.add('hidden');
            el.bookmarkGrid.innerHTML = bookmarkedWorlds.map(world => `
                <button type="button" class="bookmark-card" onclick="jumpToWorld('${world.id}')">
                    <div class="w-full h-24 rounded-lg mb-3 bg-cover bg-center" style="background-image: url('${world.image}')"></div>
                    <h3 class="text-sm font-medium text-white/90 mb-1">${world.title}</h3>
                    <p class="text-xs text-white/40">${world.author}</p>
                    <div class="bookmark-tag">
                        <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                        ${world.duration}
                    </div>
                    <div class="flex flex-wrap gap-1 mt-2">
                        ${world.tags.map(t => `<span class="text-[10px] px-1.5 py-0.5 rounded bg-white/5 text-white/40">${t}</span>`).join('')}
                    </div>
                </button>
            `).join('');
        }

        function jumpToWorld(worldId) {
            const index = worlds.findIndex(w => w.id === worldId);
            if (index !== -1) {
                switchPage('worlds');
                goToWorld(index, 0);
            }
        }

        function renderSearchResults(rawQuery) {
            const query = rawQuery.trim().toLocaleLowerCase();
            el.searchResults.replaceChildren();
            if (!query) {
                const hint = document.createElement('p');
                hint.className = 'text-sm text-white/30 text-center py-10';
                hint.textContent = '输入关键词开始搜索';
                el.searchResults.appendChild(hint);
                return;
            }

            const matches = worlds.filter(world =>
                [world.title, world.author, world.desc, ...world.tags].some(value => value.toLocaleLowerCase().includes(query))
            );
            if (!matches.length) {
                const empty = document.createElement('p');
                empty.className = 'text-sm text-white/40 text-center py-10';
                empty.textContent = '没有找到匹配的内容';
                el.searchResults.appendChild(empty);
                return;
            }

            for (const world of matches) {
                const result = document.createElement('button');
                result.type = 'button';
                result.className = 'w-full flex items-center gap-3 text-left p-3 rounded-xl bg-white/5 border border-white/10 hover:bg-white/10';
                const image = document.createElement('span');
                image.className = 'w-14 h-16 shrink-0 rounded-lg bg-cover bg-center';
                image.style.backgroundImage = `url(${world.image})`;
                const details = document.createElement('span');
                const title = document.createElement('strong');
                title.className = 'block text-sm text-white/90';
                title.textContent = world.title;
                const subtitle = document.createElement('small');
                subtitle.className = 'block text-xs text-white/45 mt-1';
                subtitle.textContent = `${world.author} · ${world.tags.join(' / ')}`;
                details.append(title, subtitle);
                result.append(image, details);
                result.addEventListener('click', () => jumpToWorld(world.id));
                el.searchResults.appendChild(result);
            }
        }

        // ============================================================
        // 账号页面
        // ============================================================
        function updateProfileStats() {
            const bookmarks = getBookmarks();
            const endings = getCollectedEndings();
            const footprints = getFootprints();
            const activeIds = new Set(worlds.map(world => world.id));
            const visibleFootprints = footprints.filter(fp => activeIds.has(fp.worldId));

            el.statWorlds.textContent = stats.exploredWorlds.filter(id => activeIds.has(id)).length;
            el.statEndings.textContent = endings.filter(key => activeIds.has(key.split('::')[0])).length;
            el.statBookmarks.textContent = bookmarks.filter(id => activeIds.has(id)).length;

            // Render footprints
            if (visibleFootprints.length === 0) {
                el.footprintList.innerHTML = '<p class="text-xs text-white/25 text-center py-4">还没有探索记录</p>';
            } else {
                el.footprintList.innerHTML = visibleFootprints.slice(0, 10).map(fp => {
                    const world = worlds.find(w => w.id === fp.worldId);
                    const worldName = world ? world.title : '未知内容';
                    const time = new Date(fp.time).toLocaleDateString('zh-CN');
                    return `
                        <div class="flex items-center justify-between p-2 rounded-lg bg-white/[0.03] border border-white/[0.06]">
                            <div>
                                <div class="text-xs text-white/70">${worldName}</div>
                                <div class="text-[10px] text-white/30 mt-0.5">结局：${fp.endingTitle || '未记录'}</div>
                            </div>
                            <span class="text-[10px] text-white/25">${time}</span>
                        </div>
                    `;
                }).join('');
            }
        }

        function toggleTextSize() {
            const sizes = ['sm', 'md', 'lg'];
            const labels = { sm: '小', md: '中', lg: '大' };
            const currentIdx = sizes.indexOf(settings.textSize || 'md');
            const nextIdx = (currentIdx + 1) % sizes.length;
            settings.textSize = sizes[nextIdx];
            applySettings();
            saveSettings();
            showToast('文字大小：' + labels[settings.textSize]);
        }

        function clearAllData() {
            if (!confirm('确定要清除所有本地数据吗？此操作不可恢复。')) return;

            Object.values(LS_KEYS).forEach(key => localStorage.removeItem(key));
            stats = { exploredWorlds: [], collectedEndings: [], totalSteps: 0 };
            settings = { textSize: 'md' };
            applySettings();
            updateProfileStats();
            renderBookmarks();
            updateLikeButton();
            showToast('所有数据已清除');
        }

        // ============================================================
        // 世界加载
        // ============================================================
        function loadWorld(index, direction = 'next') {
            const world = worlds[index];
            sendExperience('SHOW_COVER');

            if (worldSwiper) {
                worldSwiper.allowTouchMove = true;
                worldSwiper.mousewheel?.enable();
            }

            if (nodeTransitionTimer) clearTimeout(nodeTransitionTimer);
            nodeTransitionTimer = null;
            clearNodeTextSettle();
            clearNodeTextExitCopies();
            el.nodeText.textContent = '';
            el.nodeText.classList.remove('typing');
            el.nodeLayer.classList.remove('fade-in');
            el.nodeLayer.style.opacity = '';
            el.nodeLayer.style.transform = '';
            el.nodeLayer.style.transition = '';

            // 更新氛围背景
            el.ambience.style.backgroundImage = world.image ? `url(${world.image})` : '';
            el.ambience.style.backgroundColor = '#111118';
            updateWorldBackdrop(world);

            // 封面信息
            el.coverTitle.textContent = world.title;
            el.coverAuthor.textContent = world.author;
            el.coverDesc.textContent = world.desc;
            el.coverDuration.textContent = world.duration;

            // 标签
            el.worldTags.innerHTML = world.tags.map(t =>
                `<span class="px-2 py-0.5 rounded-full text-[10px] bg-white/10 text-white/70 border border-white/10">${t}</span>`
            ).join('');

            // 右侧信息
            el.rightAuthor.textContent = world.author;
            el.rightDesc.textContent = world.desc;
            el.metaNodes.textContent = world.nodes;
            el.metaTime.textContent = world.duration;
            el.metaEnds.textContent = world.ends;
            el.metaTags.textContent = world.tags.join(' / ');

            // 头像色
            const gradients = [
                'from-pink-500 to-orange-400',
                'from-emerald-400 to-cyan-500',
                'from-violet-500 to-purple-500',
                'from-amber-400 to-red-400',
                'from-blue-400 to-indigo-500',
                'from-teal-400 to-green-500',
                'from-rose-400 to-pink-600',
                'from-cyan-400 to-blue-500',
                'from-orange-400 to-yellow-500',
                'from-indigo-400 to-violet-500',
                'from-fuchsia-400 to-rose-500',
                'from-lime-400 to-emerald-500'
            ];
            el.authorAvatar.className = `info-avatar w-12 h-12 rounded-full bg-gradient-to-br ${gradients[index % gradients.length]} shrink-0`;

            // 更新喜欢按钮状态
            updateLikeButton();

            // 重置状态
            currentNodeId = null;
            pathHistory = [];

            // 显示封面，隐藏节点层和结局层
            el.coverLayer.classList.remove('hidden');
            el.btnEnter.classList.remove('hidden');
            el.nodeLayer.classList.add('opacity-0', 'pointer-events-none');
            el.endingLayer.classList.add('hidden');
            el.btnExit.classList.add('opacity-0', 'pointer-events-none');
            el.btnExit.inert = true;
            el.btnSave.classList.remove('hidden');
            el.dirControls.classList.add('opacity-0', 'pointer-events-none');
            el.dirControls.inert = true;

            // 更新体验图
            renderExpMap();

            // 更新指示器
            updateWorldDots();

            // 重新生成粒子
            generateParticles(world.theme.particles);
        }

        let activeWorldBackdrop = null;

        function updateWorldBackdrop(world) {
            const next = activeWorldBackdrop === el.worldBackdropA ? el.worldBackdropB : el.worldBackdropA;
            next.style.backgroundImage = world.image ? `url("${world.image}")` : 'none';
            next.style.backgroundColor = world.theme?.bg || '#111118';
            next.classList.add('is-visible');
            activeWorldBackdrop?.classList.remove('is-visible');
            activeWorldBackdrop = next;
        }

        function updateLikeButton() {
            const world = worlds[currentWorldIndex];
            const isLiked = isBookmarked(world.id);
            for (const likeBtn of [el.btnLike, el.btnSave]) {
                if (!likeBtn) continue;
                const heart = likeBtn.querySelector('span:first-child');
                heart.textContent = isLiked ? '♥' : '♡';
                heart.style.color = isLiked ? '#ef4444' : '';
                likeBtn.setAttribute('aria-pressed', String(isLiked));
                likeBtn.setAttribute('aria-label', isLiked ? '取消收藏当前内容' : '收藏当前内容');
            }
        }

        function generateParticles(color) {
            const layer = document.getElementById('particlesLayer');
            if (!layer) return;
            layer.innerHTML = '';
            const particleColor = {
                rain: 'rgba(190, 215, 255, 0.22)',
                dust: 'rgba(255, 245, 220, 0.18)'
            }[color] || color;
            for (let i = 0; i < 20; i++) {
                const p = document.createElement('div');
                p.className = 'particle';
                const size = Math.random() * 4 + 2;
                p.style.width = size + 'px';
                p.style.height = size + 'px';
                p.style.background = particleColor;
                p.style.left = Math.random() * 100 + '%';
                p.style.top = Math.random() * 100 + '%';
                p.style.animationDelay = Math.random() * 15 + 's';
                p.style.animationDuration = (10 + Math.random() * 10) + 's';
                layer.appendChild(p);
            }
        }

        // ============================================================
        // 进入世界
        // ============================================================
        function enterWorld() {
            const world = worlds[currentWorldIndex];
            sendExperience(experienceMatches('worlds.reading.ending') ? 'RESTART' : 'ENTER');
            if (worldSwiper) {
                worldSwiper.allowTouchMove = false;
                worldSwiper.mousewheel?.disable();
            }
            currentNodeId = world.startNode;
            pathHistory = [currentNodeId];

            // 记录探索
            if (!stats.exploredWorlds.includes(world.id)) {
                stats.exploredWorlds.push(world.id);
                saveStats();
            }

            // 动画切换
            el.coverLayer.classList.add('hidden');
            el.btnEnter.classList.add('hidden');
            el.nodeLayer.classList.remove('opacity-0', 'pointer-events-none');
            el.btnExit.classList.remove('opacity-0', 'pointer-events-none');
            el.btnExit.inert = false;
            el.btnSave.classList.add('hidden');

            renderNode(currentNodeId, 'fade');
            renderExpMap();
        }

        // ============================================================
        // 渲染节点
        // ============================================================
        function clearNodeTextSettle() {
            if (nodeTextSettleTimer) clearTimeout(nodeTextSettleTimer);
            nodeTextSettleTimer = null;
            if (nodeTextSettleHandler) {
                el.nodeText.removeEventListener('animationend', nodeTextSettleHandler);
                nodeTextSettleHandler = null;
            }
            el.nodeText.classList.remove('node-text-settle-in');
        }

        function clearNodeTextExitCopies() {
            el.nodeLayer.querySelectorAll('.node-text-exit-copy').forEach(copy => copy.remove());
        }

        function createNodeTextExitCopy() {
            clearNodeTextExitCopies();
            if (!el.nodeText.textContent.trim()) return;
            const copy = el.nodeText.cloneNode(true);
            const layerRect = el.nodeLayer.getBoundingClientRect();
            const textRect = el.nodeText.getBoundingClientRect();
            copy.removeAttribute('id');
            copy.className = 'node-text node-text-exit-copy';
            copy.setAttribute('aria-hidden', 'true');
            copy.style.left = `${textRect.left - layerRect.left}px`;
            copy.style.top = `${textRect.top - layerRect.top}px`;
            copy.style.width = `${textRect.width}px`;
            copy.style.height = `${textRect.height}px`;
            copy.scrollTop = el.nodeText.scrollTop;
            el.nodeLayer.appendChild(copy);
            const remove = () => copy.remove();
            copy.addEventListener('animationend', remove, { once: true });
            setTimeout(remove, 400);
        }

        function finishNodeTextSettle() {
            clearNodeTextSettle();
            sendExperience('TYPE_DONE');
        }

        function renderNode(nodeId, animType = 'fade') {
            // 兜底：清除任何残留的内联样式
            el.nodeLayer.style.opacity = '1';
            el.nodeLayer.style.transform = '';
            el.nodeLayer.style.transition = '';
            el.nodeLayer.classList.remove('fade-in');

            const world = worlds[currentWorldIndex];
            const node = world.data[nodeId];

            if (!node) return;

            // 结局处理
            if (node.isEnding) {
                clearNodeTextExitCopies();
                showEnding(node);
                return;
            }

            clearNodeTextSettle();
            if (animType !== 'settle') clearNodeTextExitCopies();
            sendExperience('TYPE_START');

            // 节点正文直接完整显示，不再逐字输出。
            el.nodeText.className = 'node-text';
            el.nodeText.textContent = node.text;
            el.nodeText.scrollTop = 0;
            if (animType !== 'settle') sendExperience('TYPE_DONE');

            // 方向控制
            const hasExits = node.exits && (node.exits.left || node.exits.right || node.exits.up);

            if (hasExits) {
                el.dirControls.classList.remove('opacity-0', 'pointer-events-none');
                el.dirControls.inert = false;

                // 更新按钮
                updateDirBtn('btnLeft', 'labelLeft', node.exits?.left, node.labels?.left);
                updateDirBtn('btnUp', 'labelUp', node.exits?.up, node.labels?.up);
                updateDirBtn('btnRight', 'labelRight', node.exits?.right, node.labels?.right);
            } else {
                el.dirControls.classList.add('opacity-0', 'pointer-events-none');
                el.dirControls.inert = true;
            }

            if (animType === 'settle') {
                el.nodeText.classList.add('node-text-settle-in');
                nodeTextSettleHandler = () => finishNodeTextSettle();
                el.nodeText.addEventListener('animationend', nodeTextSettleHandler, { once: true });
                nodeTextSettleTimer = setTimeout(finishNodeTextSettle, 500);
            } else if (animType === 'fade') {
                el.nodeLayer.classList.add('fade-in');
                setTimeout(() => el.nodeLayer.classList.remove('fade-in'), 600);
            }

            renderExpMap();
        }

        function updateDirBtn(btnId, labelId, target, label) {
            const btn = document.getElementById(btnId);
            const lbl = document.getElementById(labelId);
            if (target) {
                btn.style.visibility = 'visible';
                lbl.textContent = label || '';
                btn.disabled = false;
                btn.setAttribute('aria-label', label ? `${label}，向${{ left: '左', up: '上', right: '右' }[btnId.slice(3).toLowerCase()]}进入` : '进入下一位置');
            } else {
                btn.style.visibility = 'hidden';
                btn.disabled = true;
            }
        }

        // ============================================================
        // 方向导航
        // ============================================================
        function handleDirection(dir) {
            if (experienceMatches('worlds.reading.typing') || experienceMatches('worlds.reading.transitioning') || experienceMatches('worlds.reading.ending')) return;
            const world = worlds[currentWorldIndex];
            const node = world.data[currentNodeId];

            if (!node || !node.exits || !node.exits[dir]) return;

            // 原始内容里有未写出的目标节点；界面不得因此进入空白状态。
            if (!world.data[node.exits[dir]]) {
                showToast('此方向暂不可进入');
                return;
            }

            sendExperience('MOVE');
            const nextNodeId = node.exits[dir];
            createNodeTextExitCopy();

            // 记录路径
            pathHistory.push(nextNodeId);
            currentNodeId = nextNodeId;

            // 统计步数
            stats.totalSteps++;
            saveStats();

            nodeTransitionTimer = setTimeout(() => {
                sendExperience('NODE_READY');
                renderNode(nextNodeId, 'settle');
                nodeTransitionTimer = null;
            }, 100);
        }

        // ============================================================
        // 结局展示
        // ============================================================
        function showEnding(node) {
            sendExperience('ENDING');
            el.dirControls.inert = true;
            el.endingLayer.classList.remove('hidden');
            document.getElementById('endingTitle').textContent = node.title;
            document.getElementById('endingSummary').textContent = node.summary;

            // 记录结局
            const world = worlds[currentWorldIndex];
            collectEnding(world.id, node.title);
            addFootprint(world.id, node.title);

            // 结局节点加入体验图
            renderExpMap();
        }

        function restartWorld() {
            el.endingLayer.classList.add('hidden');
            enterWorld();
        }

        function exitToCover() {
            loadWorld(currentWorldIndex);
        }

        // ============================================================
        // 体验图渲染
        // ============================================================
        function renderExpMap() {
            const world = worlds[currentWorldIndex];
            const mapEl = el.expMap;

            if (!experienceMatches('worlds.reading')) {
                el.pathProgress.textContent = '未开始';
                el.expSummary.textContent = '尚无足迹';
                mapEl.innerHTML = '<div class="w-full text-center text-white/20 text-xs py-4">— 等待探索 —</div>';
                return;
            }

            el.pathProgress.textContent = `${pathHistory.length} 步`;

            const steps = pathHistory.length;
            const currentNode = world.data[currentNodeId];
            el.expSummary.textContent = currentNode?.isEnding
                ? `抵达结局「${currentNode.title}」`
                : `已走过 ${steps} 个位置`;

            // 渲染圆点序列
            mapEl.innerHTML = pathHistory.map((nid, idx) => {
                const n = world.data[nid];
                const isEnd = n?.isEnding;
                const isLast = idx === pathHistory.length - 1;
                let classes = 'exp-dot';
                if (isLast && !isEnd) classes += ' current';
                else if (isEnd) classes += ' end';
                else classes += ' visited';

                return `<div class="${classes}">${idx + 1}</div>`;
            }).join('');
        }

        // ============================================================
        // 世界切换（滚轮/键盘）
        // ============================================================
        function goToWorld(newIndex, speed = 380) {
            if (newIndex < 0 || newIndex >= worlds.length) {
                if (newIndex < 0) showToast('已经是第一个内容');
                else showToast('已经是最后一个内容');
                return;
            }

            const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
            if (worldSwiper) {
                worldSwiper.allowTouchMove = true;
                worldSwiper.mousewheel?.enable();
                if (worldSwiper.activeIndex === newIndex) {
                    currentWorldIndex = newIndex;
                    loadWorld(newIndex);
                } else {
                    worldSwiper.slideTo(newIndex, reducedMotion ? 0 : speed);
                }
                return;
            }

            currentWorldIndex = newIndex;
            loadWorld(currentWorldIndex);
        }

        function switchWorld(delta) {
            goToWorld(currentWorldIndex + delta);
        }

        function showToast(msg) {
            if (toastTimer) clearTimeout(toastTimer);
            el.toast.textContent = msg;
            el.toast.classList.add('show');
            toastTimer = setTimeout(() => el.toast.classList.remove('show'), 2000);
        }

        // ============================================================
        // 事件监听
        // ============================================================
        function setupEvents() {
            // Swiper 不可用时保留滚轮降级；正文滚动始终优先。
            let wheelAccum = 0;
            let wheelResetTimer = null;
            document.addEventListener('wheel', (e) => {
                if (worldSwiper) return;
                if (currentPage !== 'worlds' || !el.stage.contains(e.target)) return;
                if (experienceMatches('worlds.reading') && (el.nodeText.contains(e.target) || e.deltaY < 0)) return;
                wheelAccum += e.deltaY;
                clearTimeout(wheelResetTimer);
                wheelResetTimer = setTimeout(() => { wheelAccum = 0; }, 180);
                if (Math.abs(wheelAccum) > 72) {
                    clearTimeout(wheelResetTimer);
                    switchWorld(wheelAccum > 0 ? 1 : -1);
                    wheelAccum = 0;
                }
            }, { passive: true });

            // 键盘支持
            document.addEventListener('keydown', (e) => {
                if (currentPage !== 'worlds') {
                    if (e.key === 'Escape') switchPage('worlds');
                    return;
                }

                if (!experienceMatches('worlds.reading')) {
                    if (e.key === 'ArrowDown') switchWorld(1);
                    if (e.key === 'ArrowUp') switchWorld(-1);
                    if (e.key === 'Enter') enterWorld();
                    return;
                }

                if (e.key === 'ArrowLeft') { e.preventDefault(); handleDirection('left'); }
                if (e.key === 'ArrowRight') { e.preventDefault(); handleDirection('right'); }
                if (e.key === 'ArrowUp') { e.preventDefault(); handleDirection('up'); }
                if (e.key === 'ArrowDown') { e.preventDefault(); switchWorld(1); }
                if (e.key === 'Escape') exitToCover();
            });

            // 触摸支持（更精确的区分）
            let touchStartY = 0;
            let touchStartX = 0;
            let touchStarted = false;
            let touchIgnored = false;

            el.stage.addEventListener('touchstart', (e) => {
                touchStartY = e.touches[0].clientY;
                touchStartX = e.touches[0].clientX;
                touchStarted = true;
                touchIgnored = Boolean(e.target.closest('button, .node-text'));
            }, { passive: true });

            el.stage.addEventListener('touchend', (e) => {
                if (!touchStarted) return;
                touchStarted = false;
                if (touchIgnored) return;

                const dx = e.changedTouches[0].clientX - touchStartX;
                const dy = e.changedTouches[0].clientY - touchStartY;
                const absDx = Math.abs(dx);
                const absDy = Math.abs(dy);

                if (currentPage !== 'worlds') return;

                if (!experienceMatches('worlds.reading')) {
                    if (worldSwiper) return;
                    // 封面模式：上下滑动切换世界
                    if (absDy > 72 && absDy > absDx) {
                        switchWorld(dy < 0 ? 1 : -1);
                    }
                    return;
                }

                // 探索模式：左右与上进入内容方向，向下切换作品。
                if (absDx > absDy && absDx > 52) {
                    handleDirection(dx > 0 ? 'right' : 'left');
                } else if (absDy > absDx && absDy > 52 && dy < 0) {
                    handleDirection('up');
                } else if (absDy > absDx && absDy > 72 && dy > 0) {
                    switchWorld(1);
                }
            }, { passive: true });

            el.searchInput.addEventListener('input', event => renderSearchResults(event.target.value));
        }

        function toggleLike(btn) {
            const world = worlds[currentWorldIndex];
            const isLiked = isBookmarked(world.id);

            if (isLiked) {
                removeBookmark(world.id);
                showToast('已取消收藏');
            } else {
                addBookmark(world.id);
                showToast('已添加到收藏');
            }

            updateLikeButton();
            updateProfileStats();
        }

        // 启动
        init();
    </script>


</body></html>
